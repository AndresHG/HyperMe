<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe menu-bar menu and onboarding</title>
  <rect width="900" height="460" fill="#2A2D34"/>
  <!-- menu bar -->
  <rect width="900" height="26" fill="#1B1B1F"/>
  <g transform="translate(286,7)" fill="#FFFFFF">
    <rect x="0" y="5" width="2" height="4" rx="1"/><rect x="4" y="2" width="2" height="10" rx="1"/><rect x="8" y="0" width="2" height="14" rx="1"/><rect x="12" y="3" width="2" height="8" rx="1"/><rect x="16" y="5" width="2" height="4" rx="1"/>
  </g>
  <text x="840" y="18" fill="#FFFFFF" font-size="12">09:41</text>
  <!-- menu -->
  <g transform="translate(270,32)">
    <rect width="270" height="250" rx="10" fill="#1B1B1F" stroke="#3A3A40"/>
    <text x="16" y="28" fill="#FFFFFF" font-size="14" font-weight="700">HyperMe</text>
    <rect x="186" y="14" width="66" height="20" rx="10" fill="#14532D"/>
    <circle cx="198" cy="24" r="4" fill="#22C55E"/>
    <text x="207" y="28" fill="#BBF7D0" font-size="11" font-weight="600">Ready</text>
    <line x1="10" y1="46" x2="260" y2="46" stroke="#3A3A40"/>
    <text x="16" y="70" fill="#FFFFFF" font-size="13">Paste last dictation</text><text x="214" y="70" fill="#6B6B73" font-size="12">⌃⌥V</text>
    <text x="16" y="96" fill="#FFFFFF" font-size="13">Copy last dictation</text>
    <line x1="10" y1="110" x2="260" y2="110" stroke="#3A3A40"/>
    <text x="16" y="134" fill="#A1A1AA" font-size="12">Hold Fn to dictate</text>
    <text x="16" y="160" fill="#FFFFFF" font-size="13">Timing log</text>
    <rect x="222" y="148" width="30" height="16" rx="8" fill="#3A3A40"/><circle cx="231" cy="156" r="6" fill="#A1A1AA"/>
    <line x1="10" y1="176" x2="260" y2="176" stroke="#3A3A40"/>
    <text x="16" y="200" fill="#FFFFFF" font-size="13">Settings…</text><text x="226" y="200" fill="#6B6B73" font-size="12">⌘,</text>
    <text x="16" y="230" fill="#FFFFFF" font-size="13">Quit HyperMe</text><text x="226" y="230" fill="#6B6B73" font-size="12">⌘Q</text>
  </g>
  <text x="32" y="60" fill="#FFFFFF" font-size="16" font-weight="700">Menu-bar menu</text>
  <text x="32" y="82" fill="#A1A1AA" font-size="12">No Dock icon, no main window.</text>
  <text x="32" y="100" fill="#A1A1AA" font-size="12">Icon turns red while recording.</text>

  <!-- onboarding -->
  <text x="32" y="320" fill="#FFFFFF" font-size="16" font-weight="700">Onboarding: five screens, each tested before Next</text>
  <g font-size="12">
    <g transform="translate(32,340)">
      <rect width="158" height="96" rx="10" fill="#111113" stroke="#3A3A40"/>
      <text x="12" y="24" fill="#6B6B73" font-size="11">1</text><text x="12" y="44" fill="#FFFFFF" font-weight="700" font-size="13">Welcome</text>
      <text x="12" y="64" fill="#A1A1AA">Hold a key, speak,</text><text x="12" y="80" fill="#A1A1AA">words appear.</text>
    </g>
    <g transform="translate(202,340)">
      <rect width="158" height="96" rx="10" fill="#111113" stroke="#3A3A40"/>
      <text x="12" y="24" fill="#6B6B73" font-size="11">2</text><text x="12" y="44" fill="#FFFFFF" font-weight="700" font-size="13">Microphone</text>
      <g fill="#22C55E"><rect x="12" y="60" width="4" height="10"/><rect x="19" y="56" width="4" height="14"/><rect x="26" y="52" width="4" height="18"/><rect x="33" y="58" width="4" height="12"/></g>
      <text x="44" y="70" fill="#A1A1AA">Live level</text><text x="12" y="88" fill="#22C55E">✓ Working</text>
    </g>
    <g transform="translate(372,340)">
      <rect width="158" height="96" rx="10" fill="#111113" stroke="#3A3A40"/>
      <text x="12" y="24" fill="#6B6B73" font-size="11">3</text><text x="12" y="44" fill="#FFFFFF" font-weight="700" font-size="13">Permissions</text>
      <rect x="12" y="56" width="134" height="22" rx="6" fill="#26262B"/><text x="22" y="71" fill="#FFFFFF">Open Settings</text>
      <text x="12" y="90" fill="#A1A1AA" font-size="11">Accessibility, Input Mon.</text>
    </g>
    <g transform="translate(542,340)">
      <rect width="158" height="96" rx="10" fill="#111113" stroke="#3A3A40"/>
      <text x="12" y="24" fill="#6B6B73" font-size="11">4</text><text x="12" y="44" fill="#FFFFFF" font-weight="700" font-size="13">Keys</text>
      <text x="12" y="64" fill="#A1A1AA">Speechmatics</text><text x="112" y="64" fill="#22C55E">✓ Test</text>
      <text x="12" y="84" fill="#A1A1AA">Groq</text><text x="112" y="84" fill="#FFFFFF">Test</text>
    </g>
    <g transform="translate(712,340)">
      <rect width="158" height="96" rx="10" fill="#111113" stroke="#22C55E"/>
      <text x="12" y="24" fill="#6B6B73" font-size="11">5</text><text x="12" y="44" fill="#FFFFFF" font-weight="700" font-size="13">Try it</text>
      <text x="12" y="64" fill="#A1A1AA">Hold Fn</text><text x="12" y="80" fill="#A1A1AA">and say anything.</text>
      <text x="12" y="92" fill="#22C55E" font-size="11">Pasted in 0.43 s</text>
    </g>
  </g>
</svg>
