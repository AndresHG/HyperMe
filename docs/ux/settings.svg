<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe settings window, Cleanup section</title>
  <rect width="760" height="460" fill="#2A2D34"/>
  <rect x="20" y="20" width="720" height="420" rx="12" fill="#111113" stroke="#3A3A40"/>
  <circle cx="40" cy="38" r="6" fill="#FF5F57"/><circle cx="60" cy="38" r="6" fill="#FEBC2E"/><circle cx="80" cy="38" r="6" fill="#28C840"/>
  <text x="352" y="42" fill="#A1A1AA" font-size="13" font-weight="600">Settings</text>
  <!-- sidebar -->
  <rect x="20" y="58" width="170" height="382" fill="#16161A"/>
  <g font-size="13">
    <text x="40" y="92" fill="#A1A1AA">General</text>
    <text x="40" y="122" fill="#A1A1AA">Hotkey</text>
    <text x="40" y="152" fill="#A1A1AA">Speech</text>
    <rect x="30" y="166" width="150" height="26" rx="6" fill="#26262B"/>
    <text x="40" y="184" fill="#FFFFFF" font-weight="600">Cleanup</text>
    <text x="40" y="214" fill="#6B6B73">Dictionary</text><text x="120" y="214" fill="#6B6B73" font-size="10">Phase 2</text>
    <text x="40" y="244" fill="#A1A1AA">Privacy</text>
    <text x="40" y="274" fill="#A1A1AA">About</text>
  </g>
  <!-- content -->
  <text x="220" y="94" fill="#FFFFFF" font-size="18" font-weight="700">Cleanup</text>
  <text x="220" y="116" fill="#A1A1AA" font-size="12">Turns your words into written text. Used by dictation now, meetings later.</text>
  <g font-size="13">
    <text x="220" y="156" fill="#FFFFFF">Clean up dictations</text>
    <rect x="680" y="143" width="36" height="20" rx="10" fill="#22C55E"/><circle cx="706" cy="153" r="8" fill="#FFFFFF"/>
    <line x1="220" y1="174" x2="716" y2="174" stroke="#26262B"/>
    <text x="220" y="202" fill="#FFFFFF">Provider</text>
    <rect x="520" y="186" width="196" height="26" rx="6" fill="#1B1B1F" stroke="#3A3A40"/><text x="532" y="204" fill="#FFFFFF">Groq</text><text x="700" y="204" fill="#6B6B73">▾</text>
    <text x="220" y="242" fill="#FFFFFF">Model</text><text x="220" y="258" fill="#6B6B73" font-size="11">From config.toml</text>
    <rect x="520" y="226" width="196" height="26" rx="6" fill="#1B1B1F" stroke="#3A3A40"/><text x="532" y="244" fill="#FFFFFF">openai/gpt-oss-20b</text>
    <text x="220" y="292" fill="#FFFFFF">Key</text>
    <rect x="520" y="276" width="130" height="26" rx="6" fill="#1B1B1F" stroke="#3A3A40"/><text x="532" y="294" fill="#A1A1AA">In keychain</text>
    <rect x="658" y="276" width="58" height="26" rx="6" fill="#26262B"/><text x="672" y="294" fill="#FFFFFF">Test</text>
    <text x="520" y="318" fill="#22C55E" font-size="11">✓ Key works · first token 151 ms</text>
    <text x="220" y="352" fill="#FFFFFF">Deadline</text><text x="220" y="368" fill="#6B6B73" font-size="11">After this, paste the raw transcript</text>
    <rect x="520" y="336" width="196" height="26" rx="6" fill="#1B1B1F" stroke="#3A3A40"/><text x="532" y="354" fill="#FFFFFF">1000 ms</text>
    <text x="220" y="408" fill="#6B6B73">Level: none · light · medium</text><text x="420" y="408" fill="#6B6B73" font-size="11">Phase 2</text>
  </g>
</svg>
