<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe settings window, Providers section</title>
  <rect width="820" height="520" fill="#2A2D34"/>
  <rect x="20" y="20" width="780" height="480" rx="12" fill="#111113" stroke="#3A3A40"/>
  <circle cx="40" cy="38" r="6" fill="#FF5F57"/><circle cx="60" cy="38" r="6" fill="#FEBC2E"/><circle cx="80" cy="38" r="6" fill="#28C840"/>
  <text x="380" y="42" fill="#A1A1AA" font-size="13" font-weight="600">Settings</text>
  <!-- sidebar -->
  <rect x="20" y="58" width="190" height="442" fill="#16161A"/>
  <rect x="32" y="68" width="166" height="26" rx="7" fill="#1F1F24" stroke="#2E2E34"/>
  <circle cx="47" cy="80" r="5" fill="none" stroke="#6B6B73" stroke-width="1.5"/><path d="M51 84 l4 4" stroke="#6B6B73" stroke-width="1.5"/>
  <text x="62" y="85" fill="#6B6B73" font-size="12">Search settings</text>
  <g font-size="13">
    <circle cx="44" cy="117" r="5" fill="#22C55E"/><text x="56" y="122" fill="#FFFFFF">Setup check</text>
    <text x="40" y="152" fill="#6B6B73" font-size="10" font-weight="700" letter-spacing="0.6">EVERYDAY</text>
    <text x="40" y="176" fill="#A1A1AA">General</text>
    <text x="40" y="202" fill="#A1A1AA">Shortcuts</text>
    <text x="40" y="236" fill="#6B6B73" font-size="10" font-weight="700" letter-spacing="0.6">SETUP</text>
    <rect x="30" y="246" width="170" height="26" rx="6" fill="#26262B"/>
    <text x="40" y="264" fill="#FFFFFF" font-weight="600">Providers</text>
    <text x="40" y="290" fill="#A1A1AA">Connectors</text>
    <text x="40" y="316" fill="#A1A1AA">Automations</text>
    <text x="40" y="342" fill="#A1A1AA">Meetings</text>
    <text x="40" y="368" fill="#A1A1AA">Privacy</text>
    <text x="40" y="394" fill="#A1A1AA">About</text>
    <text x="40" y="482" fill="#6B6B73" font-size="10">Sections appear as features ship</text>
  </g>
  <!-- content -->
  <text x="236" y="94" fill="#FFFFFF" font-size="18" font-weight="700">Providers</text>
  <text x="236" y="116" fill="#A1A1AA" font-size="12">Every model service in one place. Keys stay in the macOS keychain.</text>
  <g font-size="12">
    <text x="236" y="150" fill="#6B6B73" font-size="10" font-weight="700" letter-spacing="0.6">SERVICES</text>
    <rect x="236" y="160" width="540" height="58" rx="10" fill="#1B1B1F"/>
    <text x="252" y="184" fill="#FFFFFF" font-size="13" font-weight="700">Speechmatics</text><text x="352" y="184" fill="#A1A1AA">melia-1 · EU</text>
    <text x="252" y="204" fill="#6B6B73" font-size="11">Speech · used by dictation</text>
    <circle cx="612" cy="189" r="4" fill="#22C55E"/><text x="622" y="193" fill="#BBF7D0" font-size="11">Works · 18 ms</text>
    <rect x="712" y="177" width="50" height="24" rx="6" fill="#26262B"/><text x="724" y="193" fill="#FFFFFF">Test</text>
    <rect x="236" y="226" width="540" height="58" rx="10" fill="#1B1B1F"/>
    <text x="252" y="250" fill="#FFFFFF" font-size="13" font-weight="700">Groq</text><text x="300" y="250" fill="#A1A1AA">openai/gpt-oss-20b</text>
    <text x="252" y="270" fill="#6B6B73" font-size="11">Language model · used by cleanup</text>
    <circle cx="612" cy="255" r="4" fill="#22C55E"/><text x="622" y="259" fill="#BBF7D0" font-size="11">Works · 151 ms</text>
    <rect x="712" y="243" width="50" height="24" rx="6" fill="#26262B"/><text x="724" y="259" fill="#FFFFFF">Test</text>
    <rect x="236" y="292" width="540" height="40" rx="10" fill="none" stroke="#3A3A40" stroke-dasharray="4 4"/>
    <text x="252" y="317" fill="#A1A1AA">+ Add a provider</text><text x="372" y="317" fill="#6B6B73" font-size="11">OpenAI-compatible, local server, …</text>
    <text x="236" y="366" fill="#6B6B73" font-size="10" font-weight="700" letter-spacing="0.6">WHAT EACH FEATURE USES</text>
    <line x1="236" y1="378" x2="776" y2="378" stroke="#26262B"/>
    <text x="236" y="400" fill="#FFFFFF">Dictation speech</text>
    <rect x="576" y="386" width="200" height="24" rx="6" fill="#1B1B1F" stroke="#3A3A40"/><text x="588" y="402" fill="#FFFFFF">Speechmatics</text><text x="760" y="402" fill="#6B6B73">▾</text>
    <text x="236" y="434" fill="#FFFFFF">Dictation cleanup</text>
    <rect x="576" y="420" width="200" height="24" rx="6" fill="#1B1B1F" stroke="#3A3A40"/><text x="588" y="436" fill="#FFFFFF">Groq</text><text x="760" y="436" fill="#6B6B73">▾</text>
    <text x="236" y="468" fill="#6B6B73">Meetings cleanup</text><text x="380" y="468" fill="#6B6B73" font-size="10">Phase 5</text>
    <rect x="576" y="454" width="200" height="24" rx="6" fill="#1B1B1F" stroke="#2E2E34"/><text x="588" y="470" fill="#6B6B73">Cloud · Local · Off</text>
  </g>
</svg>
