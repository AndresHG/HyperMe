<svg xmlns="http://www.w3.org/2000/svg" width="560" height="720" viewBox="0 0 560 720" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe panel above the orb, Needs you tab</title>
  <rect width="560" height="720" fill="#2A2D34"/>
  <!-- panel -->
  <rect x="40" y="30" width="460" height="600" rx="14" fill="#111113" stroke="#2E2E34"/>
  <path d="M452 629 l16 16 l16 -16 z" fill="#111113" stroke="#2E2E34"/>
  <rect x="453" y="626" width="30" height="4" fill="#111113"/>
  <!-- header -->
  <text x="60" y="66" fill="#FFFFFF" font-size="16" font-weight="700">HyperMe</text>
  <rect x="246" y="51" width="64" height="22" rx="11" fill="#14532D"/>
  <circle cx="259" cy="62" r="4" fill="#22C55E"/><text x="268" y="66" fill="#BBF7D0" font-size="11" font-weight="600">Ready</text>
  <g stroke="#A1A1AA" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M326 56 v12 M320 62 h12"/>
    <path d="M350 58 v8 M354 55 v14 M358 58 v8 M362 60 v4"/>
    <path d="M378 57 h14 M378 62 h14 M378 67 h14"/><circle cx="383" cy="57" r="1.8" fill="#111113"/><circle cx="388" cy="67" r="1.8" fill="#111113"/>
    <path d="M410 56 h-4 v12 h12 v-4 M412 56 h6 v6 M418 56 l-7 7"/>
    <path d="M440 57 l10 10 M450 57 l-10 10"/>
  </g>
  <!-- tabs -->
  <g font-size="12">
    <text x="60" y="104" fill="#A1A1AA">Chat</text>
    <text x="102" y="104" fill="#FFFFFF" font-weight="700">Needs you</text>
    <rect x="170" y="92" width="18" height="16" rx="8" fill="#FF4D4F"/><text x="175" y="104" fill="#FFFFFF" font-size="10" font-weight="700">2</text>
    <text x="202" y="104" fill="#A1A1AA">To do</text>
    <rect x="238" y="92" width="18" height="16" rx="8" fill="#3A3A40"/><text x="243" y="104" fill="#FFFFFF" font-size="10" font-weight="700">5</text>
    <text x="270" y="104" fill="#A1A1AA">Meetings</text>
    <text x="336" y="104" fill="#A1A1AA">Dictation</text>
    <text x="406" y="104" fill="#A1A1AA">Agents</text>
  </g>
  <line x1="60" y1="114" x2="480" y2="114" stroke="#26262B"/>
  <rect x="102" y="112" width="62" height="2" fill="#FFFFFF"/>
  <!-- list header -->
  <text x="60" y="142" fill="#FFFFFF" font-size="13" font-weight="600">2 need you</text>
  <text x="140" y="142" fill="#6B6B73" font-size="12">· Checked just now</text>
  <path d="M376 136 a6 6 0 1 1 -2 -4 M374 128 v4 h4" stroke="#A1A1AA" stroke-width="1.5" fill="none"/>
  <rect x="404" y="127" width="76" height="22" rx="6" fill="#1B1B1F" stroke="#3A3A40"/><text x="420" y="142" fill="#FFFFFF" font-size="12">Clear all</text>
  <!-- card 1 -->
  <g transform="translate(60,160)">
    <rect width="420" height="170" rx="10" fill="#1B1B1F"/>
    <rect x="14" y="14" width="58" height="20" rx="6" fill="#26262B"/><text x="23" y="28" fill="#A1A1AA" font-size="11" font-weight="600">GitHub</text>
    <rect x="300" y="14" width="44" height="20" rx="10" fill="#3B1D1E"/><text x="310" y="28" fill="#FF8A8C" font-size="11">2 new</text>
    <text x="352" y="28" fill="#6B6B73" font-size="11">2 h ago</text>
    <text x="14" y="58" fill="#FFFFFF" font-size="15" font-weight="700">Review requested: faster paste fallback</text>
    <text x="14" y="80" fill="#A1A1AA" font-size="12">Two comments since yesterday. Next: approve or ask for a test.</text>
    <text x="14" y="104" fill="#6B6B73" font-size="11">10:12  New commit pushed     ·     11:40  CI passed locally</text>
    <rect x="14" y="122" width="96" height="30" rx="8" fill="#FFFFFF"/><text x="28" y="141" fill="#111113" font-size="12" font-weight="700">Ask Hyper</text>
    <rect x="118" y="122" width="62" height="30" rx="8" fill="none" stroke="#3A3A40"/><text x="134" y="141" fill="#FFFFFF" font-size="12">Open</text>
    <rect x="188" y="122" width="96" height="30" rx="8" fill="none" stroke="#3A3A40"/><text x="203" y="141" fill="#FFFFFF" font-size="12">Mark done</text>
    <text x="326" y="141" fill="#6B6B73" font-size="11">Not important</text>
  </g>
  <!-- card 2 -->
  <g transform="translate(60,342)">
    <rect width="420" height="150" rx="10" fill="#1B1B1F"/>
    <rect x="14" y="14" width="44" height="20" rx="6" fill="#26262B"/><text x="23" y="28" fill="#A1A1AA" font-size="11" font-weight="600">Mail</text>
    <text x="352" y="28" fill="#6B6B73" font-size="11">35 min</text>
    <text x="14" y="58" fill="#FFFFFF" font-size="15" font-weight="700">Draft ready: reply about Thursday</text>
    <text x="14" y="80" fill="#A1A1AA" font-size="12">Drafted from your voice note. Next: read and send it yourself.</text>
    <rect x="14" y="102" width="96" height="30" rx="8" fill="#FFFFFF"/><text x="28" y="121" fill="#111113" font-size="12" font-weight="700">Ask Hyper</text>
    <rect x="118" y="102" width="62" height="30" rx="8" fill="none" stroke="#3A3A40"/><text x="134" y="121" fill="#FFFFFF" font-size="12">Open</text>
    <rect x="188" y="102" width="96" height="30" rx="8" fill="none" stroke="#3A3A40"/><text x="203" y="121" fill="#FFFFFF" font-size="12">Mark done</text>
    <text x="326" y="121" fill="#6B6B73" font-size="11">Not important</text>
  </g>
  <!-- composer -->
  <rect x="60" y="560" width="420" height="50" rx="12" fill="#1B1B1F" stroke="#2E2E34"/>
  <path d="M80 590 l8 -8 a4 4 0 0 1 6 6 l-10 10 a2.5 2.5 0 0 1 -4 -4 l9 -9" stroke="#A1A1AA" stroke-width="1.5" fill="none"/>
  <text x="106" y="590" fill="#6B6B73" font-size="13">Message Hyper…</text>
  <rect x="300" y="574" width="44" height="22" rx="11" fill="#26262B"/><text x="310" y="589" fill="#A1A1AA" font-size="11" font-weight="600">Auto</text>
  <circle cx="366" cy="585" r="14" fill="#26262B"/><rect x="362" y="577" width="8" height="12" rx="4" fill="#FFFFFF"/><path d="M359 586 a7 7 0 0 0 14 0 M366 593 v3" stroke="#FFFFFF" stroke-width="1.4" fill="none"/>
  <rect x="390" y="571" width="78" height="28" rx="8" fill="#E4E4E7"/><text x="414" y="590" fill="#111113" font-size="12" font-weight="700">Send</text>
  <!-- orb -->
  <circle cx="468" cy="676" r="22" fill="#111113" stroke="#3A3A40"/>
  <circle cx="468" cy="676" r="4" fill="#FFFFFF"/>
  <ellipse cx="468" cy="676" rx="13" ry="5" fill="none" stroke="#A1A1AA" stroke-width="1.3"/>
  <ellipse cx="468" cy="676" rx="13" ry="5" fill="none" stroke="#A1A1AA" stroke-width="1.3" transform="rotate(60 468 676)"/>
  <ellipse cx="468" cy="676" rx="13" ry="5" fill="none" stroke="#A1A1AA" stroke-width="1.3" transform="rotate(-60 468 676)"/>
  <circle cx="485" cy="659" r="8" fill="#FF4D4F"/><text x="482" y="663" fill="#FFFFFF" font-size="10" font-weight="700">2</text>
  <text x="40" y="684" fill="#6B6B73" font-size="11">Example content only. The orb opens the panel; dictation still uses the pill.</text>
</svg>
