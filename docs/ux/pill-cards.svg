<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe pill cards: answer, preview, action menu</title>
  <rect width="960" height="460" fill="#2A2D34"/>
  <text x="32" y="40" fill="#FFFFFF" font-size="18" font-weight="700">Phase 3: the pill grows upward into a card. Focus never leaves your app.</text>

  <!-- Answer card -->
  <g transform="translate(32,70)">
    <text x="0" y="0" fill="#A1A1AA" font-size="12" font-weight="600">QUESTION</text>
    <rect x="0" y="14" width="270" height="200" rx="14" fill="#111113" stroke="#3A3A40"/>
    <text x="16" y="42" fill="#6B6B73" font-size="11">You asked</text>
    <text x="16" y="62" fill="#A1A1AA" font-size="13">"When is the release cut-off?"</text>
    <text x="16" y="94" fill="#FFFFFF" font-size="15" font-weight="700">Thursday at 17:00.</text>
    <text x="16" y="116" fill="#A1A1AA" font-size="12">Moved from Wednesday in the</text>
    <text x="16" y="132" fill="#A1A1AA" font-size="12">planning notes on Monday.</text>
    <text x="16" y="160" fill="#6B6B73" font-size="11">Source: Meeting notes, Mon</text>
    <line x1="16" y1="176" x2="254" y2="176" stroke="#26262B"/>
    <text x="16" y="200" fill="#A1A1AA" font-size="11">↵ Copy   ⌘↵ Paste   Esc</text>
    <!-- pill -->
    <rect x="85" y="232" width="100" height="30" rx="15" fill="#111113" stroke="#3A3A40"/>
    <text x="104" y="252" fill="#FFFFFF" font-size="12" font-weight="600">Question</text>
  </g>

  <!-- Preview card -->
  <g transform="translate(340,70)">
    <text x="0" y="0" fill="#A1A1AA" font-size="12" font-weight="600">ACTION, WAITING FOR ↵</text>
    <rect x="0" y="14" width="300" height="200" rx="14" fill="#111113" stroke="#3A3A40"/>
    <rect x="16" y="30" width="62" height="20" rx="6" fill="#26262B"/><text x="25" y="44" fill="#A1A1AA" font-size="11" font-weight="600">GitHub</text>
    <text x="86" y="44" fill="#6B6B73" font-size="11">New issue · hyperme</text>
    <text x="16" y="76" fill="#FFFFFF" font-size="15" font-weight="700">Paste fails in Ghostty</text>
    <text x="16" y="98" fill="#A1A1AA" font-size="12">Terminals use a different paste</text>
    <text x="16" y="114" fill="#A1A1AA" font-size="12">shortcut; detect them and send it.</text>
    <text x="16" y="142" fill="#6B6B73" font-size="11">"This" = the open bug report page</text>
    <line x1="16" y1="160" x2="284" y2="160" stroke="#26262B"/>
    <rect x="16" y="172" width="96" height="28" rx="8" fill="#7C5CFF"/><text x="30" y="191" fill="#FFFFFF" font-size="12" font-weight="700">↵ Create</text>
    <text x="126" y="191" fill="#A1A1AA" font-size="12">Esc Cancel</text>
    <text x="214" y="191" fill="#A1A1AA" font-size="12">⌘K More</text>
    <rect x="100" y="232" width="100" height="30" rx="15" fill="#111113" stroke="#3A3A40"/>
    <text x="124" y="252" fill="#FFFFFF" font-size="12" font-weight="600">Action</text>
  </g>

  <!-- Action menu -->
  <g transform="translate(680,70)">
    <text x="0" y="0" fill="#A1A1AA" font-size="12" font-weight="600">⌘K ON A CARD</text>
    <rect x="0" y="14" width="248" height="200" rx="14" fill="#111113" stroke="#3A3A40"/>
    <rect x="10" y="24" width="228" height="26" rx="7" fill="#1F1F24"/><text x="22" y="41" fill="#6B6B73" font-size="12">Search actions…</text>
    <rect x="10" y="58" width="228" height="26" rx="7" fill="#7C5CFF" opacity="0.35"/>
    <text x="22" y="75" fill="#FFFFFF" font-size="12">Create issue</text><text x="214" y="75" fill="#6B6B73" font-size="11">↵</text>
    <text x="22" y="105" fill="#FFFFFF" font-size="12">Edit title and text</text><text x="206" y="105" fill="#6B6B73" font-size="11">⌘E</text>
    <text x="22" y="133" fill="#FFFFFF" font-size="12">Change repository</text><text x="206" y="133" fill="#6B6B73" font-size="11">⌘R</text>
    <text x="22" y="161" fill="#FFFFFF" font-size="12">Open draft in browser</text><text x="206" y="161" fill="#6B6B73" font-size="11">⌘O</text>
    <text x="22" y="189" fill="#FFFFFF" font-size="12">Back to plain text</text><text x="206" y="189" fill="#6B6B73" font-size="11">⌘Z</text>
  </g>

  <text x="32" y="372" fill="#FFFFFF" font-size="13" font-weight="700">Rules</text>
  <text x="32" y="394" fill="#A1A1AA" font-size="12">The pill names the route first: Dictation, Question or Action.   ↵ does the main thing, Esc backs out, ⌘K shows the rest.</text>
  <text x="32" y="414" fill="#A1A1AA" font-size="12">Nothing leaves the app without ↵.   After an action, a done card shows the link for 5 s with ⌘C and ⌘O.</text>
  <text x="32" y="440" fill="#6B6B73" font-size="11">Example content only.</text>
</svg>
