<svg xmlns="http://www.w3.org/2000/svg" width="620" height="560" viewBox="0 0 620 560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe quick sheet rising from the dot</title>
  <defs><linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B4150"/><stop offset="1" stop-color="#2A2D34"/></linearGradient></defs>
  <rect width="620" height="560" fill="url(#desk)"/>
  <text x="24" y="34" fill="#A1A1AA" font-size="12">Click the dot: only what matters right now. ⌘↑ opens the full app.</text>
  <rect x="120" y="56" width="380" height="440" rx="18" fill="#111113" stroke="#3A3A40"/>
  <!-- ask -->
  <rect x="136" y="72" width="348" height="38" rx="12" fill="#1B1B1F" stroke="#7C5CFF"/>
  <text x="152" y="96" fill="#6B6B73" font-size="13">Ask Hyper or give an order…</text>
  <circle cx="462" cy="91" r="12" fill="#26262B"/><rect x="458" y="83" width="8" height="12" rx="4" fill="#FFFFFF"/>
  <path d="M455 92 a7 7 0 0 0 14 0" stroke="#FFFFFF" stroke-width="1.3" fill="none"/>
  <!-- now -->
  <text x="136" y="138" fill="#6B6B73" font-size="10" font-weight="700" letter-spacing="0.6">NOW</text>
  <rect x="136" y="146" width="348" height="44" rx="10" fill="#1B1B1F"/>
  <circle cx="152" cy="168" r="4" fill="#FF4D4F"/>
  <text x="164" y="164" fill="#FFFFFF" font-size="13" font-weight="700">Weekly planning · in 4 min</text>
  <text x="164" y="181" fill="#A1A1AA" font-size="11">Calendar</text>
  <rect x="376" y="157" width="98" height="22" rx="6" fill="#7C5CFF"/><text x="384" y="172" fill="#FFFFFF" font-size="11" font-weight="700">↵ Join + notes</text>
  <rect x="136" y="196" width="348" height="34" rx="10" fill="#1B1B1F"/>
  <circle cx="152" cy="213" r="5" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-dasharray="20 12"/>
  <text x="164" y="217" fill="#FFFFFF" font-size="12" font-weight="600">Claude Code: terminal paste fix</text>
  <rect x="380" y="209" width="70" height="6" rx="3" fill="#26262B"/><rect x="380" y="209" width="46" height="6" rx="3" fill="#7C5CFF"/>
  <!-- waiting -->
  <text x="136" y="258" fill="#7C5CFF" font-size="10" font-weight="700" letter-spacing="0.6">WAITING FOR YOU · 5</text>
  <g font-size="12">
    <rect x="136" y="266" width="348" height="32" rx="9" fill="#1B1B1F"/><text x="150" y="286" fill="#FFFFFF">Reply draft: demo moves to Friday</text><text x="420" y="286" fill="#A1A1AA" font-size="11">↵ Review</text>
    <rect x="136" y="302" width="348" height="32" rx="9" fill="#1B1B1F"/><text x="150" y="322" fill="#FFFFFF">3 tickets proposed from planning</text><text x="420" y="322" fill="#A1A1AA" font-size="11">↵ Review</text>
    <rect x="136" y="338" width="348" height="32" rx="9" fill="#1B1B1F"/><text x="150" y="358" fill="#FFFFFF">Agent done: dictionary import</text><text x="420" y="358" fill="#A1A1AA" font-size="11">↵ Review</text>
    <text x="150" y="388" fill="#A1A1AA" font-size="11">2 more in HyperMe</text>
  </g>
  <!-- last dictation -->
  <text x="136" y="414" fill="#6B6B73" font-size="10" font-weight="700" letter-spacing="0.6">LAST DICTATION</text>
  <rect x="136" y="422" width="348" height="30" rx="9" fill="#1B1B1F"/>
  <text x="150" y="441" fill="#F59E0B" font-size="12">Connection lost · audio saved</text>
  <text x="400" y="441" fill="#FFFFFF" font-size="11" font-weight="700">↵ Retry</text>
  <!-- footer -->
  <line x1="136" y1="464" x2="484" y2="464" stroke="#26262B"/>
  <text x="136" y="484" fill="#FFFFFF" font-size="12" font-weight="600">Open HyperMe  ⌘↑</text>
  <text x="408" y="484" fill="#6B6B73" font-size="12">⌘, Settings</text>
  <!-- dot -->
  <circle cx="310" cy="532" r="8" fill="#111113" stroke="#7C5CFF" stroke-width="2.5"/>
  <line x1="0" y1="546" x2="620" y2="546" stroke="#3A3A40"/>
</svg>
