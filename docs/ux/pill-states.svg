<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe Phase 1 pill states</title>
  <rect width="880" height="420" fill="#2A2D34"/>
  <text x="32" y="44" fill="#FFFFFF" font-size="20" font-weight="700">Phase 1 pill: bottom centre, only while dictating</text>
  <text x="32" y="68" fill="#A1A1AA" font-size="13">Non-activating panel. Never takes focus. Hidden when idle.</text>

  <!-- Recording -->
  <g transform="translate(32,100)">
    <rect width="150" height="34" rx="17" fill="#111113" stroke="#3A3A40"/>
    <circle cx="20" cy="17" r="5" fill="#FF4D4F"/>
    <g fill="#FFFFFF">
      <rect x="36" y="13" width="3" height="8" rx="1.5"/><rect x="43" y="9" width="3" height="16" rx="1.5"/>
      <rect x="50" y="6" width="3" height="22" rx="1.5"/><rect x="57" y="11" width="3" height="12" rx="1.5"/>
      <rect x="64" y="8" width="3" height="18" rx="1.5"/><rect x="71" y="12" width="3" height="10" rx="1.5"/>
      <rect x="78" y="10" width="3" height="14" rx="1.5"/><rect x="85" y="14" width="3" height="6" rx="1.5"/>
      <rect x="92" y="11" width="3" height="12" rx="1.5"/><rect x="99" y="13" width="3" height="8" rx="1.5"/>
    </g>
    <text x="116" y="21" fill="#6B6B73" font-size="11">esc</text>
    <text x="0" y="62" fill="#FFFFFF" font-size="13" font-weight="600">Recording</text>
    <text x="0" y="80" fill="#A1A1AA" font-size="12">Red dot, live level. Esc cancels.</text>
  </g>

  <!-- Working -->
  <g transform="translate(250,100)">
    <rect width="96" height="34" rx="17" fill="#111113" stroke="#3A3A40"/>
    <rect x="20" y="16" width="56" height="2" rx="1" fill="#3A3A44"/><rect x="34" y="16" width="18" height="2" rx="1" fill="#A08CFF"/>
    <text x="0" y="62" fill="#FFFFFF" font-size="13" font-weight="600">Working</text>
    <text x="0" y="80" fill="#A1A1AA" font-size="12">A line with a running violet light.</text>
  </g>

  <!-- Done -->
  <g transform="translate(450,100)">
    <rect width="110" height="34" rx="17" fill="#111113" stroke="#3A3A40"/>
    <path d="M18 17 l5 5 l9 -10" stroke="#22C55E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="22" fill="#FFFFFF" font-size="13" font-weight="600">Pasted</text>
    <text x="0" y="62" fill="#FFFFFF" font-size="13" font-weight="600">Done</text>
    <text x="0" y="80" fill="#A1A1AA" font-size="12">600 ms, then fades out.</text>
  </g>

  <!-- Raw text -->
  <g transform="translate(650,100)">
    <rect width="122" height="34" rx="17" fill="#111113" stroke="#F59E0B"/>
    <circle cx="20" cy="17" r="5" fill="#F59E0B"/>
    <text x="34" y="22" fill="#FFFFFF" font-size="13" font-weight="600">Raw text</text>
    <text x="0" y="62" fill="#FFFFFF" font-size="13" font-weight="600">Raw text</text>
    <text x="0" y="80" fill="#A1A1AA" font-size="12">Cleanup slow or failed.</text>
    <text x="0" y="96" fill="#A1A1AA" font-size="12">Click to see why.</text>
  </g>

  <!-- Nothing heard -->
  <g transform="translate(32,250)">
    <rect width="140" height="34" rx="17" fill="#111113" stroke="#3A3A40"/>
    <circle cx="20" cy="17" r="5" fill="#6B6B73"/>
    <text x="34" y="22" fill="#A1A1AA" font-size="13" font-weight="600">Nothing heard</text>
    <text x="0" y="62" fill="#FFFFFF" font-size="13" font-weight="600">Nothing heard</text>
    <text x="0" y="80" fill="#A1A1AA" font-size="12">Empty transcript. Nothing pasted.</text>
  </g>

  <!-- Notice -->
  <g transform="translate(250,250)">
    <rect width="260" height="34" rx="17" fill="#111113" stroke="#3A3A40"/>
    <rect x="15" y="15" width="11" height="9" rx="2" fill="#A1A1AA"/>
    <path d="M17.5 15 v-3 a3 3 0 0 1 6 0 v3" stroke="#A1A1AA" stroke-width="1.6" fill="none"/>
    <text x="36" y="22" fill="#FFFFFF" font-size="13" font-weight="600">Not available in password fields</text>
    <text x="0" y="62" fill="#FFFFFF" font-size="13" font-weight="600">Notice</text>
    <text x="0" y="80" fill="#A1A1AA" font-size="12">Secure input is on. Nothing recorded.</text>
  </g>

  <!-- Error -->
  <g transform="translate(540,250)">
    <rect width="316" height="34" rx="17" fill="#111113" stroke="#FF4D4F"/>
    <circle cx="20" cy="17" r="7" fill="none" stroke="#FF4D4F" stroke-width="1.8"/>
    <rect x="19" y="12" width="2" height="6" fill="#FF4D4F"/><rect x="19" y="20" width="2" height="2" fill="#FF4D4F"/>
    <text x="36" y="22" fill="#FFFFFF" font-size="13" font-weight="600">Speechmatics key rejected</text>
    <text x="238" y="22" fill="#A1A1AA" font-size="13">· Settings</text>
    <text x="0" y="62" fill="#FFFFFF" font-size="13" font-weight="600">Error</text>
    <text x="0" y="80" fill="#A1A1AA" font-size="12">Names the provider, never the key.</text>
    <text x="0" y="96" fill="#A1A1AA" font-size="12">Click opens Settings.</text>
  </g>
</svg>
