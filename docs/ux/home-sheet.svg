<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe Home sheet rising from the bottom edge, Today view</title>
  <defs><linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B4150"/><stop offset="1" stop-color="#2A2D34"/></linearGradient></defs>
  <rect width="900" height="560" fill="url(#desk)"/>
  <!-- sheet -->
  <path d="M70 560 v-468 a20 20 0 0 1 20 -20 h720 a20 20 0 0 1 20 20 v468 z" fill="#F4F4F8" opacity="0.97"/>
  <text x="102" y="116" fill="#18181B" font-size="22" font-weight="700">Today</text>
  <text x="180" y="116" fill="#71717A" font-size="13">Thursday 26</text>
  <rect x="664" y="96" width="134" height="26" rx="8" fill="#FFFFFF"/><text x="678" y="113" fill="#A1A1AA" font-size="12">Search  ⌘K</text>

  <!-- left column: waiting -->
  <text x="102" y="160" fill="#7C5CFF" font-size="11" font-weight="700" letter-spacing="0.6">WAITING FOR YOU · 3</text>
  <g font-size="13">
    <g transform="translate(102,172)">
      <rect width="380" height="44" rx="10" fill="#FFFFFF"/>
      <circle cx="20" cy="22" r="9" fill="#EDE9FF"/><text x="15" y="27" fill="#7C5CFF" font-size="11" font-weight="700">M</text>
      <text x="38" y="27" fill="#18181B" font-weight="600">Reply draft: demo moves to Friday</text>
      <rect x="306" y="12" width="62" height="20" rx="5" fill="#F4F4F8" stroke="#E4E4EF"/><text x="314" y="26" fill="#18181B" font-size="11" font-weight="600">↵ Review</text>
    </g>
    <g transform="translate(102,224)">
      <rect width="380" height="44" rx="10" fill="#FFFFFF"/>
      <circle cx="20" cy="22" r="9" fill="#EDE9FF"/><text x="15" y="27" fill="#7C5CFF" font-size="11" font-weight="700">A</text>
      <text x="38" y="27" fill="#18181B" font-weight="600">Agent done: terminal paste fix</text>
      <rect x="306" y="12" width="62" height="20" rx="5" fill="#F4F4F8" stroke="#E4E4EF"/><text x="314" y="26" fill="#18181B" font-size="11" font-weight="600">↵ Review</text>
    </g>
    <g transform="translate(102,276)">
      <rect width="380" height="44" rx="10" fill="#FFFFFF"/>
      <circle cx="20" cy="22" r="9" fill="#EDE9FF"/><text x="15" y="27" fill="#7C5CFF" font-size="11" font-weight="700">T</text>
      <text x="38" y="27" fill="#18181B" font-weight="600">3 tickets proposed from planning</text>
      <rect x="306" y="12" width="62" height="20" rx="5" fill="#F4F4F8" stroke="#E4E4EF"/><text x="314" y="26" fill="#18181B" font-size="11" font-weight="600">↵ Review</text>
    </g>
  </g>
  <text x="102" y="352" fill="#71717A" font-size="11" font-weight="700" letter-spacing="0.6">RUNNING</text>
  <g transform="translate(102,362)" font-size="12">
    <rect width="380" height="36" rx="10" fill="#FFFFFF"/>
    <circle cx="20" cy="18" r="5" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-dasharray="20 12"/>
    <text x="36" y="22" fill="#18181B" font-weight="600">Dictionary import</text><text x="160" y="22" fill="#71717A">step 3 of 5</text>
  </g>

  <!-- right column: the day -->
  <text x="510" y="160" fill="#71717A" font-size="11" font-weight="700" letter-spacing="0.6">THE DAY</text>
  <rect x="710" y="146" width="88" height="20" rx="6" fill="#E4E4EF"/><rect x="712" y="148" width="42" height="16" rx="5" fill="#FFFFFF"/>
  <text x="721" y="160" fill="#18181B" font-size="10" font-weight="700">Day</text><text x="762" y="160" fill="#71717A" font-size="10">Week</text>
  <g font-size="11" fill="#A1A1AA"><text x="510" y="190">09</text><text x="510" y="232">10</text><text x="510" y="274">11</text><text x="510" y="316">12</text><text x="510" y="358">13</text><text x="510" y="400">14</text></g>
  <g stroke="#E4E4EF"><line x1="532" y1="186" x2="798" y2="186"/><line x1="532" y1="228" x2="798" y2="228"/><line x1="532" y1="270" x2="798" y2="270"/><line x1="532" y1="312" x2="798" y2="312"/><line x1="532" y1="354" x2="798" y2="354"/><line x1="532" y1="396" x2="798" y2="396"/></g>
  <rect x="538" y="190" width="256" height="16" rx="4" fill="#FFFFFF"/><text x="546" y="202" fill="#71717A" font-size="11">Morning plan · job</text>
  <rect x="538" y="249" width="256" height="40" rx="6" fill="#D9D3FF"/>
  <text x="548" y="266" fill="#2E1F8F" font-size="12" font-weight="700">Weekly planning · in 12 min</text>
  <text x="548" y="281" fill="#4B3BB5" font-size="11">↵ Join and take notes</text>
  <line x1="532" y1="244" x2="798" y2="244" stroke="#FF4D4F" stroke-width="1.5"/><circle cx="532" cy="244" r="3" fill="#FF4D4F"/>
  <rect x="538" y="358" width="256" height="34" rx="6" fill="#FFFFFF"/><text x="548" y="379" fill="#18181B" font-size="12">Design review</text>

  <!-- view switcher near the pill -->
  <rect x="340" y="466" width="220" height="30" rx="15" fill="#FFFFFF"/>
  <text x="358" y="486" fill="#71717A" font-size="12">History</text>
  <rect x="410" y="470" width="58" height="22" rx="11" fill="#18181B"/><text x="422" y="485" fill="#FFFFFF" font-size="12" font-weight="600">Today</text>
  <text x="480" y="486" fill="#71717A" font-size="12">Meetings</text>
  <text x="580" y="486" fill="#A1A1AA" font-size="11">⌘1 ⌘2 ⌘3 · Esc to close</text>
  <!-- the dot it grew from -->
  <circle cx="450" cy="530" r="7" fill="#111113" stroke="#7C5CFF" stroke-width="2"/>
  <text x="70" y="40" fill="#A1A1AA" font-size="12">Example content only. The sheet grew from the dot at the bottom centre and sinks back into it.</text>
</svg>
