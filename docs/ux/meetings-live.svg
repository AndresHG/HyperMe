<svg xmlns="http://www.w3.org/2000/svg" width="560" height="640" viewBox="0 0 560 640" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe live meeting view: grey live text turns white when cleaned</title>
  <rect width="560" height="640" fill="#2A2D34"/>
  <rect x="40" y="30" width="460" height="580" rx="14" fill="#111113" stroke="#2E2E34"/>
  <text x="60" y="66" fill="#FFFFFF" font-size="16" font-weight="700">HyperMe</text>
  <rect x="236" y="51" width="98" height="22" rx="11" fill="#3B1D1E"/>
  <circle cx="249" cy="62" r="4" fill="#FF4D4F"/><text x="258" y="66" fill="#FF8A8C" font-size="11" font-weight="600">Rec 12:04</text>
  <g font-size="12">
    <text x="60" y="104" fill="#A1A1AA">Chat</text><text x="102" y="104" fill="#A1A1AA">Needs you</text><text x="202" y="104" fill="#A1A1AA">To do</text>
    <text x="270" y="104" fill="#FFFFFF" font-weight="700">Meetings</text><text x="336" y="104" fill="#A1A1AA">Dictation</text><text x="406" y="104" fill="#A1A1AA">Agents</text>
  </g>
  <line x1="60" y1="114" x2="480" y2="114" stroke="#26262B"/><rect x="270" y="112" width="54" height="2" fill="#FFFFFF"/>
  <!-- meeting header -->
  <text x="60" y="146" fill="#FFFFFF" font-size="15" font-weight="700">Weekly planning</text>
  <text x="60" y="166" fill="#6B6B73" font-size="12">Me · Them (2, from the invite)</text>
  <rect x="330" y="132" width="150" height="26" rx="13" fill="#1B1B1F" stroke="#3A3A40"/>
  <text x="344" y="149" fill="#A1A1AA" font-size="12">Cleanup:</text><text x="400" y="149" fill="#FFFFFF" font-size="12" font-weight="600">Cloud</text><text x="462" y="149" fill="#6B6B73" font-size="11">▾</text>
  <!-- dropdown -->
  <g transform="translate(330,162)">
    <rect width="150" height="96" rx="8" fill="#1B1B1F" stroke="#3A3A40"/>
    <text x="12" y="24" fill="#FFFFFF" font-size="12" font-weight="600">✓ Cloud</text><text x="78" y="24" fill="#6B6B73" font-size="10">Groq</text>
    <text x="12" y="52" fill="#FFFFFF" font-size="12">   Local</text><text x="78" y="52" fill="#6B6B73" font-size="10">on this Mac</text>
    <text x="12" y="80" fill="#FFFFFF" font-size="12">   Off</text><text x="78" y="80" fill="#6B6B73" font-size="10">grey stays</text>
  </g>
  <!-- transcript -->
  <g font-size="13">
    <text x="60" y="290" fill="#6B6B73" font-size="11" font-weight="700">THEM · 12:01</text>
    <text x="60" y="310" fill="#FFFFFF">Let's move the release to Thursday so QA has a full day.</text>
    <text x="60" y="344" fill="#6B6B73" font-size="11" font-weight="700">ME · 12:02</text>
    <text x="60" y="364" fill="#FFFFFF">Agreed. I'll update the ticket and tell support.</text>
    <text x="60" y="398" fill="#6B6B73" font-size="11" font-weight="700">THEM · 12:03</text>
    <text x="60" y="418" fill="#FFFFFF">Can you also check the paste issue in the terminal?</text>
    <text x="60" y="452" fill="#6B6B73" font-size="11" font-weight="700">ME · 12:04</text>
    <text x="60" y="472" fill="#7A7A82">yeah so i think it's the uh the shortcut terminals use</text>
    <text x="60" y="492" fill="#7A7A82">a different paste key so we need to</text>
    <rect x="276" y="481" width="2" height="14" fill="#A1A1AA"/>
  </g>
  <g font-size="11">
    <rect x="60" y="514" width="10" height="10" rx="2" fill="#FFFFFF"/><text x="76" y="523" fill="#A1A1AA">Cleaned</text>
    <rect x="140" y="514" width="10" height="10" rx="2" fill="#7A7A82"/><text x="156" y="523" fill="#A1A1AA">Live, on-device</text>
  </g>
  <!-- controls -->
  <rect x="60" y="548" width="420" height="44" rx="12" fill="#1B1B1F"/>
  <g fill="#FF4D4F"><rect x="76" y="562" width="3" height="16" rx="1.5"/><rect x="82" y="566" width="3" height="8" rx="1.5"/><rect x="88" y="559" width="3" height="22" rx="1.5"/><rect x="94" y="564" width="3" height="12" rx="1.5"/></g>
  <text x="108" y="575" fill="#A1A1AA" font-size="12">Recording mic and system audio</text>
  <rect x="400" y="556" width="68" height="28" rx="8" fill="#FF4D4F"/><text x="420" y="575" fill="#FFFFFF" font-size="12" font-weight="700">Stop</text>
</svg>
