<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>HyperMe live meeting window: grey live text turns white when cleaned</title>
  <rect width="560" height="560" fill="#2A2D34"/>
  <rect x="40" y="30" width="460" height="500" rx="14" fill="#111113" stroke="#2E2E34"/>
  <circle cx="64" cy="58" r="5" fill="#FF4D4F"/>
  <text x="78" y="63" fill="#FFFFFF" font-size="15" font-weight="700">Weekly planning</text>
  <text x="212" y="63" fill="#FF8A8C" font-size="12" font-weight="600">12:04</text>
  <text x="64" y="84" fill="#6B6B73" font-size="12">Me · Them (2, from the invite)</text>
  <rect x="330" y="46" width="150" height="26" rx="13" fill="#1B1B1F" stroke="#3A3A40"/>
  <text x="344" y="63" fill="#A1A1AA" font-size="12">Cleanup:</text><text x="400" y="63" fill="#FFFFFF" font-size="12" font-weight="600">Cloud</text><text x="462" y="63" fill="#6B6B73" font-size="11">▾</text>
  <g transform="translate(330,76)">
    <rect width="150" height="96" rx="8" fill="#1B1B1F" stroke="#3A3A40"/>
    <text x="12" y="24" fill="#FFFFFF" font-size="12" font-weight="600">✓ Cloud</text><text x="78" y="24" fill="#6B6B73" font-size="10">Groq</text>
    <text x="12" y="52" fill="#FFFFFF" font-size="12">   Local</text><text x="78" y="52" fill="#6B6B73" font-size="10">on this Mac</text>
    <text x="12" y="80" fill="#FFFFFF" font-size="12">   Off</text><text x="78" y="80" fill="#6B6B73" font-size="10">grey stays</text>
  </g>
  <g font-size="13">
    <text x="64" y="200" fill="#6B6B73" font-size="11" font-weight="700">THEM · 12:01</text>
    <text x="64" y="220" fill="#FFFFFF">Let's move the release to Thursday so QA has a full day.</text>
    <text x="64" y="254" fill="#6B6B73" font-size="11" font-weight="700">ME · 12:02</text>
    <text x="64" y="274" fill="#FFFFFF">Agreed. I'll update the ticket and tell support.</text>
    <text x="64" y="308" fill="#6B6B73" font-size="11" font-weight="700">THEM · 12:03</text>
    <text x="64" y="328" fill="#FFFFFF">Can you also check the paste issue in the terminal?</text>
    <text x="64" y="362" fill="#6B6B73" font-size="11" font-weight="700">ME · 12:04</text>
    <text x="64" y="382" fill="#7A7A82">yeah so i think it's the uh the shortcut terminals use</text>
    <text x="64" y="402" fill="#7A7A82">a different paste key so we need to</text>
    <rect x="280" y="391" width="2" height="14" fill="#A1A1AA"/>
  </g>
  <g font-size="11">
    <rect x="64" y="424" width="10" height="10" rx="2" fill="#FFFFFF"/><text x="80" y="433" fill="#A1A1AA">Cleaned</text>
    <rect x="144" y="424" width="10" height="10" rx="2" fill="#7A7A82"/><text x="160" y="433" fill="#A1A1AA">Live, on-device</text>
  </g>
  <rect x="64" y="460" width="412" height="48" rx="12" fill="#1B1B1F"/>
  <g fill="#FF4D4F"><rect x="80" y="476" width="3" height="16" rx="1.5"/><rect x="86" y="480" width="3" height="8" rx="1.5"/><rect x="92" y="473" width="3" height="22" rx="1.5"/><rect x="98" y="478" width="3" height="12" rx="1.5"/></g>
  <text x="112" y="489" fill="#A1A1AA" font-size="12">Mic and system audio</text>
  <text x="268" y="489" fill="#6B6B73" font-size="12">⌘N Note</text>
  <rect x="392" y="469" width="72" height="30" rx="8" fill="#FF4D4F"/><text x="413" y="489" fill="#FFFFFF" font-size="12" font-weight="700">Stop</text>
</svg>
