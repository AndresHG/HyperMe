<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>HyperMe Home window, Dictionary page (Phase 2)</title>
  <rect width="940" height="600" fill="#2A2D34"/>
  <rect x="20" y="20" width="900" height="560" rx="12" fill="#FBFAF8"/>
  <!-- sidebar -->
  <path d="M32 20 h168 v560 h-168 a12 12 0 0 1 -12 -12 v-536 a12 12 0 0 1 12 -12z" fill="#F2F0EC"/>
  <circle cx="40" cy="38" r="6" fill="#FF5F57"/><circle cx="60" cy="38" r="6" fill="#FEBC2E"/><circle cx="80" cy="38" r="6" fill="#28C840"/>
  <circle cx="44" cy="76" r="8" fill="#111113" stroke="#7C5CFF" stroke-width="2"/>
  <text x="60" y="81" fill="#18181B" font-size="15" font-weight="700">HyperMe</text>
  <g font-size="13">
    <text x="44" y="121" fill="#52525B">Home</text>
    <text x="44" y="151" fill="#52525B">History</text>
    <rect x="30" y="162" width="160" height="28" rx="7" fill="#E7E3FF"/>
    <text x="44" y="181" fill="#2E1F8F" font-weight="700">Dictionary</text><text x="160" y="181" fill="#6B5FB5" font-size="11">⌘3</text>
    <text x="44" y="211" fill="#52525B">Style</text>
    <line x1="36" y1="500" x2="184" y2="500" stroke="#E4E1DA"/>
    <text x="44" y="528" fill="#71717A">Settings</text><text x="44" y="556" fill="#71717A">Help</text>
  </g>
  <!-- header -->
  <text x="232" y="74" fill="#18181B" font-size="24" font-weight="700">Dictionary</text>
  <text x="232" y="98" fill="#71717A" font-size="13">Words HyperMe should always get right.</text>
  <rect x="580" y="58" width="186" height="28" rx="8" fill="#FFFFFF" stroke="#ECE9E3"/>
  <text x="594" y="77" fill="#A1A1AA" font-size="12">⌕  Search words</text>
  <rect x="774" y="58" width="92" height="28" rx="8" fill="#7C5CFF"/>
  <text x="786" y="77" fill="#FFFFFF" font-size="12" font-weight="700">Add word</text>
  <rect x="846" y="64" width="14" height="16" rx="3" fill="#9B83FF"/><text x="849" y="76" fill="#FFFFFF" font-size="10" font-weight="700">N</text>
  <rect x="872" y="58" width="28" height="28" rx="8" fill="#FFFFFF" stroke="#ECE9E3"/><text x="880" y="77" fill="#52525B" font-size="13" font-weight="700">⋯</text>

  <!-- suggested -->
  <text x="232" y="138" fill="#7C5CFF" font-size="11" font-weight="700" letter-spacing="0.6">SUGGESTED · 2</text>
  <g font-size="13">
    <g transform="translate(232,148)">
      <rect width="668" height="40" rx="9" fill="#FFFFFF" stroke="#ECE9E3"/>
      <text x="16" y="25" fill="#71717A">next js</text><text x="70" y="25" fill="#A1A1AA">→</text>
      <text x="90" y="25" fill="#18181B" font-weight="700">Next.js</text>
      <text x="152" y="25" fill="#A1A1AA" font-size="12">fixed once in Slack</text>
      <rect x="520" y="10" width="56" height="20" rx="5" fill="#EDE9FF"/><text x="530" y="24" fill="#2E1F8F" font-size="11" font-weight="700">↵ Add</text>
      <rect x="584" y="10" width="72" height="20" rx="5" fill="#F4F2EE" stroke="#E4E1DA"/><text x="593" y="24" fill="#18181B" font-size="11" font-weight="600">⌫ Dismiss</text>
    </g>
    <g transform="translate(232,194)">
      <rect width="668" height="40" rx="9" fill="#FFFFFF" stroke="#ECE9E3"/>
      <text x="16" y="25" fill="#71717A">mesa</text><text x="56" y="25" fill="#A1A1AA">→</text>
      <text x="76" y="25" fill="#18181B" font-weight="700">Mesa</text>
      <text x="122" y="25" fill="#B45309" font-size="12">common word: asks before it replaces everywhere</text>
      <rect x="520" y="10" width="56" height="20" rx="5" fill="#EDE9FF"/><text x="530" y="24" fill="#2E1F8F" font-size="11" font-weight="700">↵ Add</text>
      <rect x="584" y="10" width="72" height="20" rx="5" fill="#F4F2EE" stroke="#E4E1DA"/><text x="593" y="24" fill="#18181B" font-size="11" font-weight="600">⌫ Dismiss</text>
    </g>
  </g>

  <!-- list -->
  <text x="232" y="270" fill="#71717A" font-size="11" font-weight="700" letter-spacing="0.6">YOUR WORDS · 38</text>
  <text x="836" y="270" fill="#A1A1AA" font-size="11">most used</text>
  <line x1="232" y1="280" x2="900" y2="280" stroke="#ECE9E3"/>
  <g font-size="13">
    <text x="232" y="306" fill="#18181B" font-weight="700">Zentrix</text>
    <text x="330" y="306" fill="#A1A1AA" font-size="12">heard as zen trix, sun trix</text>
    <circle cx="790" cy="302" r="7" fill="#EDE9FF"/><text x="786" y="306" fill="#7C5CFF" font-size="9" font-weight="700">✦</text>
    <text x="840" y="306" fill="#71717A" font-size="12">41 uses</text>

    <rect x="226" y="318" width="674" height="32" rx="7" fill="#F4F2EE"/>
    <text x="232" y="339" fill="#18181B" font-weight="700">LangChain</text>
    <text x="330" y="339" fill="#A1A1AA" font-size="12">spelling only</text>
    <text x="632" y="339" fill="#71717A" font-size="11">⌘K edit · ⌫ delete</text>
    <text x="840" y="339" fill="#71717A" font-size="12">23 uses</text>

    <text x="232" y="372" fill="#18181B" font-weight="700">Quorbit</text>
    <text x="330" y="372" fill="#A1A1AA" font-size="12">heard as corbit, cuore bit</text>
    <text x="840" y="372" fill="#71717A" font-size="12">17 uses</text>

    <text x="232" y="404" fill="#18181B" font-weight="700">Ana Ruiz</text>
    <text x="330" y="404" fill="#A1A1AA" font-size="12">heard as ana ruis</text>
    <circle cx="790" cy="400" r="7" fill="#EDE9FF"/><text x="786" y="404" fill="#7C5CFF" font-size="9" font-weight="700">✦</text>
    <text x="840" y="404" fill="#71717A" font-size="12">9 uses</text>

    <text x="232" y="436" fill="#18181B" font-weight="700">kubectl</text>
    <text x="330" y="436" fill="#A1A1AA" font-size="12">heard as cube control, cube cuttle</text>
    <text x="840" y="436" fill="#71717A" font-size="12">6 uses</text>
  </g>
  <text x="232" y="462" fill="#A1A1AA" font-size="11">✦ learned from your edits</text>

  <!-- learning switch -->
  <line x1="232" y1="482" x2="900" y2="482" stroke="#ECE9E3"/>
  <rect x="232" y="500" width="34" height="20" rx="10" fill="#7C5CFF"/><circle cx="256" cy="510" r="8" fill="#FFFFFF"/>
  <text x="278" y="509" fill="#18181B" font-size="13" font-weight="600">Learn from my edits</text>
  <text x="278" y="526" fill="#71717A" font-size="12">After a dictation, HyperMe notices when you fix a word. What it reads stays on your Mac.</text>
  <text x="232" y="562" fill="#A1A1AA" font-size="11">Example content only, invented names. Import and Export are in the ⋯ menu. History → Fix (⌘D) adds a word from any dictation.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
