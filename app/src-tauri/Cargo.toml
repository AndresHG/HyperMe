[package]
name = "hyperme-app"
description = "HyperMe's macOS app: the menu-bar item, the pill and the windows around the core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "hyperme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", default-features = false }

[dependencies]
hyperme-core.workspace = true
hyperme-platform = { path = "../../crates/hyperme-platform" }
hyperme-providers = { path = "../../crates/hyperme-providers" }
serde.workspace = true
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon"] }
tokio = { workspace = true, features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"

[lints]
workspace = true
