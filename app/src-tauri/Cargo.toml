[package]
name = "hyperme-app"
description = "HyperMe's macOS app: the menu-bar item, the pill and the windows around the core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "hyperme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", default-features = false }

[dependencies]
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon"] }
# tauri::generate_context! writes serde_json calls for the plugins' config (the updater's), so
# every platform needs it, not only macOS.
serde_json.workspace = true

# The dictation, settings and walkthrough run on macOS only until Linux and Windows follow.
[target.'cfg(target_os = "macos")'.dependencies]
hyperme-core.workspace = true
hyperme-platform = { path = "../../crates/hyperme-platform" }
hyperme-providers = { path = "../../crates/hyperme-providers" }
serde.workspace = true
tauri-nspanel = "2.1.1"
# Signed updates (docs/RELEASING.md): checks, verifies with minisign and swaps HyperMe.app.
# native-tls like the rest of the app, so no second TLS stack (rustls, ring) comes in.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }
tokio = { workspace = true, features = ["sync", "time"] }
# The clock for Settings → Connectors' sync ages (connectors.rs). Already in the tree.
time = { workspace = true, features = ["std"] }

[dev-dependencies]
# The pure modules (pill, onboarding, geometry) are tested on every platform.
hyperme-core.workspace = true
serde.workspace = true
# The morning card tests in pill.rs build dates; time is macOS-only above.
time = { workspace = true, features = ["std"] }
# tauri's own mock runtime, to test that commands send their events. Not a new crate.
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon", "test"] }

[lints]
workspace = true
