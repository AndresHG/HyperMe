[package]
name = "hyperme-app"
description = "HyperMe's macOS app: the menu-bar item, the pill and the windows around the core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# Tauri 2.12 needs Rust 1.90.
rust-version = "1.90"

[[bin]]
name = "hyperme"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", default-features = false }

[dependencies]
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"

[lints]
workspace = true
