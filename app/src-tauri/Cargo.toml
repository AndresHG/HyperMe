[package]
name = "hyperme-app"
description = "HyperMe's macOS app: the menu-bar item, the pill and the windows around the core."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "hyperme"
path = "src/main.rs"

[features]
# Developer builds only, never a release (spec 182, R-15 to R-17). Each is switched on at run
# time by its environment variable: HYPERME_TRACE_CHROME=<path>, HYPERME_OTLP_ENDPOINT=<url>.
trace-chrome = ["hyperme-devtrace/trace-chrome"]
otel = ["hyperme-devtrace/otel"]

[build-dependencies]
tauri-build = { version = "2.7.6", default-features = false }

[dependencies]
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon"] }
# tauri::generate_context! writes serde_json calls for the plugins' config (the updater's), so
# every platform needs it, not only macOS.
serde_json.workspace = true
# Typed bindings for the web pages (spec 257, R-8 and R-9): the TypeScript types and command
# functions are generated from the commands' Rust signatures. Pinned exactly while they are
# release candidates, so an update is a deliberate change with a diff in bindings.ts.
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }

# The dictation, settings and walkthrough run on macOS only until Linux and Windows follow.
[target.'cfg(target_os = "macos")'.dependencies]
hyperme-core = { workspace = true, features = ["specta"] }
hyperme-platform = { path = "../../crates/hyperme-platform" }
hyperme-providers = { path = "../../crates/hyperme-providers" }
serde.workspace = true
tauri-nspanel = "2.1.1"
# Signed updates (docs/RELEASING.md): checks, verifies with minisign and swaps HyperMe.app.
# native-tls like the rest of the app, so no second TLS stack (rustls, ring) comes in.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }
tokio = { workspace = true, features = ["sync", "time"] }
# Developer-only trace exports, compiled in only with the features below (spec 182, R-15 to
# R-17). Without them it adds no crate beyond tracing-subscriber, already in the tree.
hyperme-devtrace = { path = "../../crates/hyperme-devtrace" }
# Warnings and errors as events, for the warnings file (spec 182, R-14). Already in the tree.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The clock for Settings → Connectors' sync ages (connectors.rs). Already in the tree.
time = { workspace = true, features = ["std"] }

[dev-dependencies]
# The pure modules (pill, onboarding, geometry) are tested on every platform.
hyperme-core.workspace = true
serde.workspace = true
# The morning card tests in pill.rs build dates; time is macOS-only above.
time = { workspace = true, features = ["std"] }
# tauri's own mock runtime, to test that commands send their events. Not a new crate.
tauri = { version = "2.12.7", features = ["macos-private-api", "tray-icon", "test"] }
# The approval card's wait and its 5-minute timeout under a paused clock (approvals.rs). Already
# a dependency; these features add no crate.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
