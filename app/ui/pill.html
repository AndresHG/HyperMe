<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HyperMe pill</title>
<style>
  /* Tokens and states from docs/UX.md, "Visual language", "The pill" and "The voice while you
     talk" (U-14, U-15). The pill is always dark, whatever the system theme (U-16). */
  :root {
    --surface: #111113;
    --edge: rgba(255, 255, 255, 0.06);
    --text: #ffffff;
    --muted: #a1a1aa;
    --recording: #ff4d4f;
    --done: #22c55e;
    --raw: #f59e0b;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    cursor: default;
  }
  /* The panel is transparent: only the capsule (or the bead) is drawn, centred in it. */
  body { display: flex; align-items: center; justify-content: center; }
  .pill {
    position: relative;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    border-radius: 999px;
    background: var(--surface);
    box-shadow: inset 0 0 0 1px var(--edge);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 30px;
    font: 500 13px ui-rounded, -apple-system, system-ui, sans-serif;
    white-space: nowrap;
    /* The one spring from the bead's centre for every size change (docs/UX.md, 180 ms). */
    transition: width 180ms cubic-bezier(0.22, 1, 0.36, 1), height 180ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .pill.error, .pill.retry { box-shadow: inset 0 0 0 1.5px var(--recording); cursor: pointer; }
  /* The bead at rest (U-13, B: glass): a small dark glass bead with a soft highlight. Still:
     no animation runs while idle. */
  .pill.idle {
    width: 14px;
    height: 14px;
    padding: 0;
    background: radial-gradient(circle at 35% 30%, #4a4a55 0%, #18181d 60%, #0b0b0e 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 1px 3px rgba(0, 0, 0, 0.35);
    cursor: pointer;
  }
  .pill.idle::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 2.5px;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
  }
  .pill.idle > * { display: none !important; }
  /* Until the first view arrives, and whenever the panel is hidden, nothing is drawn. */
  .pill.hidden { display: none; }
  /* The state's mark sits at the left edge, so the label and the voice stay in the exact centre. */
  .icon { position: absolute; left: 14px; top: 0; bottom: 0; display: flex; align-items: center; }
  .icon:empty { display: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  /* Hands-free (#167): ✕ cancels at the left, the red square stops at the right, after Wispr
     Flow's bar. Shown only in the locked state. */
  .hf {
    position: absolute; top: 0; bottom: 0; margin: auto 0; width: 20px; height: 20px;
    border: 0; padding: 0; border-radius: 50%; display: none; align-items: center;
    justify-content: center; cursor: pointer; background: #26262b; color: var(--muted);
    font: 600 11px -apple-system, system-ui, sans-serif;
  }
  .hf:hover { color: var(--text); background: #33333a; }
  .hf.cancel { left: 8px; }
  .hf.stop { right: 8px; background: rgba(255, 77, 79, 0.18); }
  .hf.stop::before { content: ''; width: 7px; height: 7px; border-radius: 1.5px; background: var(--recording); }
  .hf.stop:hover { background: rgba(255, 77, 79, 0.3); }
  .pill.locked .hf { display: flex; }
  canvas { flex: none; display: none; }
  @media (prefers-reduced-motion: reduce) {
    /* Reduce motion: no spring, a short cross-fade instead. */
    .pill { transition: opacity 120ms linear; }
  }
  .label { overflow: hidden; text-overflow: ellipsis; }
  .label:empty { display: none; }
  .muted { color: var(--muted); }
  /* The morning card (#92, docs/ux/daily-cards.svg). Heights match pill.rs (CARD_*), so the
     panel fits it exactly. It never takes focus, so it is answered with a click. */
  .card {
    box-sizing: border-box; width: 100%; height: 100%; padding: 18px; border-radius: 18px;
    background: var(--surface); box-shadow: inset 0 0 0 1px #3a3a40; color: var(--text);
    font: 12px -apple-system, system-ui, sans-serif; overflow: hidden;
  }
  .card[hidden] { display: none; }
  .card h1 { margin: 0; height: 24px; font: 700 15px ui-rounded, -apple-system, sans-serif; }
  .card .line { height: 20px; line-height: 20px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .line.strong { color: var(--text); font-size: 12px; }
  .card .task { height: 28px; margin-bottom: 4px; border-radius: 9px; background: #1b1b1f; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
  .card .task i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--muted); flex: none; }
  .card .task.due i { background: var(--raw); box-shadow: none; }
  .card .task.unblocked i { background: #7c5cff; box-shadow: none; }
  .card .task span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .task em { font-style: normal; font-size: 11px; color: #6b6b73; }
  .card .task.due em { color: var(--raw); }
  .card .task.unblocked em { color: #a08cff; }
  .card .keys { height: 42px; display: flex; align-items: flex-end; gap: 8px; }
  .card button { font: 600 11px -apple-system, sans-serif; height: 26px; padding: 0 12px; border-radius: 7px; border: 0; background: #26262b; color: var(--muted); cursor: pointer; }
  .card button.main { background: #7c5cff; color: #fff; }
  .card .bad { color: var(--recording); }
</style>
</head>
<body>
  <div id="pill" class="pill hidden" role="status" aria-live="polite">
    <span id="icon" class="icon"></span>
    <canvas id="voice" aria-hidden="true"></canvas>
    <span id="label" class="label"></span>
    <button id="cancel" class="hf cancel" aria-label="Cancel dictation" title="Cancel (Esc)">✕</button>
    <button id="stop" class="hf stop" aria-label="Stop and paste" title="Stop and paste"></button>
  </div>
  <div id="card" class="card" role="dialog" aria-label="Morning card" hidden></div>
<script>
  // Each state has an icon and a word, never colour alone (docs/UX.md).
  const icons = {
    recording: '<span class="dot" style="background:var(--recording)"></span>',
    notice: '<span class="muted">🔒</span>',
    error: '<span style="color:var(--recording)">!</span>',
    retry: '<span style="color:var(--recording)">↻</span>',
  };
  const pill = document.getElementById('pill');
  const icon = document.getElementById('icon');
  const label = document.getElementById('label');
  const canvas = document.getElementById('voice');
  const ctx = canvas.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

  // The voice: a row of white bars that ripple out from the centre with the input level (U-14).
  const BARS = 11, BAR_W = 3, GAP = 3, HEIGHT = 20, MIN = 3;
  const WIDTH = BARS * BAR_W + (BARS - 1) * GAP;
  const CENTRE = (BARS - 1) / 2;
  const FRAME_MS = 1000 / 30;                   // 30 frames a second, only while visible
  const SMOOTH = 1 - Math.exp(-FRAME_MS / 80);  // about 80 ms of smoothing
  const SETTLE_MS = 160;                        // bars to line after release (U-15)
  const LIGHT_MS = 1400;                        // one run of the light, there and back
  const TRACK = '#3a3a44', LIGHT = '160,140,255';
  // Taller in the middle, so the row reads as a voice.
  const shape = Array.from({ length: BARS }, (_, i) =>
    0.55 + 0.45 * Math.cos(((i - CENTRE) / (CENTRE + 1)) * Math.PI / 2));

  let kind = 'hidden';
  let target = 0;   // the last level from the microphone, 0 to 1
  let smooth = 0;
  const history = new Array(CENTRE + 1).fill(0); // [0] now, [d] d frames ago
  const heights = new Array(BARS).fill(MIN);
  let since = 0;    // when the current state began
  let raf = 0, lastFrame = 0;
  let frames = 0;   // frames drawn, for the headless check that nothing runs while hidden

  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(WIDTH * ratio);
  canvas.height = Math.round(HEIGHT * ratio);
  canvas.style.width = WIDTH + 'px';
  canvas.style.height = HEIGHT + 'px';
  ctx.scale(ratio, ratio);

  function step(now) {
    smooth += (target - smooth) * SMOOTH;
    history.pop();
    history.unshift(smooth);
    for (let i = 0; i < BARS; i++) {
      // Each bar takes the level a frame after its neighbour nearer the centre. With Reduce
      // motion they all take the level now, without the ripple or the idle stir.
      const value = reduce.matches ? smooth : history[Math.round(Math.abs(i - CENTRE))];
      // Silence keeps the bars low but never flat, so the pill still looks alive.
      const alive = reduce.matches ? 0 : 0.6 * (1 + Math.sin(now / 260 + i * 0.9));
      heights[i] = Math.min(HEIGHT, MIN + alive + (HEIGHT - MIN) * value * shape[i]);
    }
  }

  function drawBars(heightOf) {
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < BARS; i++) {
      const h = heightOf(i);
      ctx.beginPath();
      ctx.roundRect(i * (BAR_W + GAP), (HEIGHT - h) / 2, BAR_W, h, BAR_W / 2);
      ctx.fill();
    }
  }

  function drawWorking(now) {
    const t = now - since;
    if (t < SETTLE_MS && !reduce.matches) {
      const k = 1 - Math.pow(1 - t / SETTLE_MS, 3);
      drawBars((i) => heights[i] + (2 - heights[i]) * k);
      return;
    }
    const y = HEIGHT / 2 - 1;
    ctx.fillStyle = TRACK;
    ctx.beginPath();
    ctx.roundRect(0, y, WIDTH, 2, 1);
    ctx.fill();
    // A small violet light runs along the line until the text lands. With Reduce motion it
    // stays still in the middle.
    const light = 24;
    const phase = reduce.matches ? 0.5
      : (1 - Math.cos(((t - SETTLE_MS) / LIGHT_MS) * 2 * Math.PI)) / 2;
    const x = phase * (WIDTH - light);
    const glow = ctx.createLinearGradient(x, 0, x + light, 0);
    glow.addColorStop(0, `rgba(${LIGHT},0)`);
    glow.addColorStop(0.5, `rgba(${LIGHT},1)`);
    glow.addColorStop(1, `rgba(${LIGHT},0)`);
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.roundRect(x, y - 0.5, light, 3, 1.5);
    ctx.fill();
  }

  function frame(now) {
    raf = 0;
    if (!voiced(kind) && kind !== 'working') return;
    if (now - lastFrame >= FRAME_MS - 2) {
      lastFrame = now;
      frames++;
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      if (voiced(kind)) {
        step(now);
        drawBars((i) => heights[i]);
      } else {
        drawWorking(now);
      }
    }
    if (!document.hidden) raf = requestAnimationFrame(frame);
  }

  // Recording, held or hands-free: the bars follow the voice.
  function voiced(k) { return k === 'recording' || k === 'locked'; }

  function animate() {
    if (!raf && (voiced(kind) || kind === 'working')) raf = requestAnimationFrame(frame);
  }

  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
  }

  const tauri = window.__TAURI__;

  // ---- The morning card ----
  const card = document.getElementById('card');
  const node = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  // A card is the morning card or an alert (docs/UX.md, "Alerts"); `kind` says which.
  function showCard(view) {
    hidden();
    kind = 'card';
    if (view.kind === 'alert') return showAlert(view);
    const parts = [node('h1', null, view.title)];
    if (view.yesterday) parts.push(node('div', 'line', view.yesterday));
    if (view.meetings) parts.push(node('div', 'line strong', view.meetings));
    for (const t of view.tasks) {
      const row = node('div', 'task' + (t.tone ? ' ' + t.tone : ''));
      row.append(node('i'), node('span', null, t.title));
      if (t.mark) row.append(node('em', null, t.mark));
      parts.push(row);
    }
    if (view.footer) parts.push(node('div', 'line', view.footer));
    if (view.mail) parts.push(node('div', 'line strong', view.mail));
    if (view.stale) parts.push(node('div', 'line', view.stale));
    const keys = node('div', 'keys');
    const open = node('button', 'main', 'Open Today');
    const later = node('button', null, 'Later');
    if (tauri) {
      open.addEventListener('click', () => tauri.core.invoke('card_open_today'));
      later.addEventListener('click', () => tauri.core.invoke('card_dismiss'));
    }
    keys.append(open, later);
    parts.push(keys);
    card.replaceChildren(...parts);
    card.hidden = false;
  }

  function showAlert(view) {
    const title = node('h1', null, view.title);
    title.prepend(node('span', 'bad', '! '));
    const keys = node('div', 'keys');
    const fix = node('button', 'main', view.action);
    const later = node('button', null, 'Later');
    if (tauri) {
      fix.addEventListener('click', () => tauri.core.invoke('card_action'));
      later.addEventListener('click', () => tauri.core.invoke('card_dismiss'));
    }
    keys.append(fix, later);
    card.replaceChildren(title, node('div', 'line strong', view.detail), keys);
    card.hidden = false;
  }

  function render(view) {
    card.hidden = true;
    if (view.kind === 'card') {
      if (tauri) tauri.core.invoke('pill_card').then((c) => { if (c) showCard(c); });
      return;
    }
    const was = kind;
    kind = view.kind;
    since = performance.now();
    pill.className = 'pill ' + kind;
    icon.innerHTML = icons[kind] || '';
    label.textContent = view.label;
    label.className = 'label' + (kind === 'quiet' || kind === 'notice' ? ' muted' : '');
    const moving = voiced(kind) || kind === 'working';
    canvas.style.display = moving ? 'block' : 'none';
    if (voiced(kind) && !voiced(was)) {
      // The bars rise from a flat line; the first frame is drawn now, inside the 50 ms budget.
      target = smooth = 0;
      history.fill(0);
      heights.fill(MIN);
      lastFrame = since;
      ctx.clearRect(0, 0, WIDTH, HEIGHT);
      drawBars(() => MIN);
    }
    if (moving) animate(); else stop();
  }

  // Nothing runs while the pill is hidden.
  function hidden() {
    card.hidden = true;
    kind = 'hidden';
    stop();
    pill.className = 'pill hidden';
    canvas.style.display = 'none';
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop(); else animate();
  });

  // Ready for the next key-down before its event arrives, but still.
  render({ kind: 'recording', label: '' });
  hidden();

  if (tauri) {
    // A view sent before these listeners exist is lost (the bead is sent at launch), so once they
    // are in place the page asks for the current one, unless an event has already come.
    let heard = false;
    Promise.all([
      tauri.event.listen('pill', (event) => { heard = true; render(event.payload); }),
      tauri.event.listen('pill-hidden', () => { heard = true; hidden(); }),
      tauri.event.listen('card', (event) => { heard = true; showCard(event.payload); }),
      tauri.event.listen('level', (event) => { target = event.payload; }),
    ]).then(() => tauri.core.invoke('pill_view')).then((view) => {
      if (!heard && view) render(view);
    });
    pill.addEventListener('click', () => tauri.core.invoke('pill_clicked'));
    // #167 AC-4: the hands-free buttons; the click stays off the pill itself.
    for (const [id, stop] of [['stop', true], ['cancel', false]]) {
      document.getElementById(id).addEventListener('click', (event) => {
        event.stopPropagation();
        tauri.core.invoke('pill_hands_free', { stop });
      });
    }
  }
</script>
</body>
</html>
