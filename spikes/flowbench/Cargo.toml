[package]
name = "flowbench"
version = "0.1.0"
edition = "2024"
description = "Phase 0 speed test for HyperMe: key release to cleaned text"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.105"
base64 = "0.23.1"
clap = { version = "4.6.10", features = ["derive"] }
cpal = "0.18.2"
futures-util = "0.3.34"
hound = "3.5.1"
# native-tls keeps the TLS stack on the system library (Security.framework on macOS).
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "json", "multipart", "native-tls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "test-util"] }
