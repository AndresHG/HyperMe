# HyperMe workspace. Each crate inherits the package fields, versions and lints below.
# Spikes keep their own lockfiles and build on their own (`cd spikes/flowbench && cargo test`).

[workspace]
resolver = "3"
members = [
    "app/src-tauri",
    "crates/hyperme-core",
    "crates/hyperme-platform",
    "crates/hyperme-providers",
    "crates/hyperme-quality",
]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.90"

[workspace.dependencies]
hyperme-core = { path = "crates/hyperme-core" }
cpal = "0.18.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# bundled: SQLite is compiled in, so Linux and Windows need no system library. No default
# features: the statement cache pulls in foldhash, which is Zlib-licensed only.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "native-tls"] }
serde_json = "1.0.154"
# native-tls keeps the TLS stack on the system library (Security.framework on macOS).
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"
tokio = { version = "1.54.1", default-features = false }

[workspace.lints.rust]
# Platform code that needs `unsafe` allows it in the one module that does, with a comment.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
