name: CI

# Build, lint and test every Rust crate on every pull request and on master.
# `.` is the Cargo workspace at the root (crates/*); spikes/flowbench sits
# outside it with its own lockfile. Add new standalone crates to the matrix's
# `crate` list; workspace members need no entry. CLAUDE.md: fmt, clippy -D warnings and tests pass before every commit.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous head.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint-workflows:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  # Chooses the operating systems. macOS is the first platform, so it runs on
  # every pull request once the repository is public (standard runners are free
  # for public repositories). While it is private, macOS minutes cost ten times
  # Linux minutes, so macOS runs only on pushes to master and manual runs.
  # Windows joins when there is a crate for it.
  plan:
    name: Plan platforms
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - id: os
        env:
          PRIVATE: ${{ github.event.repository.private }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$PRIVATE" = "true" ] && [ "$EVENT" = "pull_request" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (${{ matrix.crate }}, ${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        crate: [., spikes/flowbench]
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system headers (cpal, Tauri)
        if: runner.os == 'Linux'
        working-directory: .
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        # Tests never call a paid API: they use local fakes and test servers,
        # so CI needs no keys.
        run: cargo test --locked

      - name: Developer trace exports (spec 182, AC-9)
        # The exports are tested with their features on, against a local OTLP receiver; the
        # app as released must contain neither feature's crates.
        if: matrix.crate == '.'
        run: |
          cargo clippy -p hyperme-devtrace --all-targets --features otel,trace-chrome --locked -- -D warnings
          cargo test -p hyperme-devtrace --features otel,trace-chrome --locked
          if cargo tree -p hyperme-app -e normal --target all --locked | grep -E 'opentelemetry|tracing-chrome'; then
            echo "A release build must not contain the developer trace exports" >&2
            exit 1
          fi
