name: Security

# Two checks:
#   - secrets: gitleaks over the whole history of every branch. The repository
#     is meant to be public, so one leaked key anywhere in history is a leak.
#   - deps: cargo-deny on every crate. Licences must be MIT, Apache-2.0 or BSD
#     (CLAUDE.md; the exceptions are listed in deny.toml), and no crate may
#     carry a RustSec advisory. Advisories change without a commit here, so the
#     scan also runs weekly.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks reads history, not just the tree
          persist-credentials: false  # a downloaded binary runs in this checkout

      - name: Scan every commit for secrets
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          # --redact: a finding must not print the secret into a public log.
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner \
            --config .gitleaks.toml --log-opts="--all" .

  deps:
    name: Licences and advisories (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crate: [., spikes/flowbench]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.crate }}/Cargo.toml
          command: check licenses advisories bans sources
          arguments: --config deny.toml
