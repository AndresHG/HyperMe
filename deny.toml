# cargo-deny policy for every crate in this repository. Run it locally with:
#   cargo deny check                                                    (the workspace)
#   cargo deny --manifest-path spikes/flowbench/Cargo.toml --config deny.toml check

[graph]
all-features = true

[licenses]
# CLAUDE.md: dependencies must be MIT, Apache-2.0 or BSD.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Not on the CLAUDE.md list: permissive, asks for attribution, and comes in
  # through `url`, which every Rust HTTP client and Tauri use. Whether to allow
  # it is issue #16; remove this line if the owner says no.
  "Unicode-3.0",
]
confidence-threshold = 0.9
# Named exceptions, each for one crate that Tauri 2 brings in (owner, 26 November 2026: allow these
# named crates only, unmodified). We never change their files, so MPL-2.0's file-level copyleft
# asks nothing of HyperMe's own code.
exceptions = [
  # Through `dirs`, which Tauri uses for app folders; part of the app binary.
  { allow = ["MPL-2.0"], crate = "option-ext" },
  # Through `tauri-utils`' HTML handling, inside Tauri's build script and macros: build time
  # only, not part of the app binary.
  { allow = ["MPL-2.0"], crate = "cssparser" },
  { allow = ["MPL-2.0"], crate = "cssparser-macros" },
  { allow = ["MPL-2.0"], crate = "selectors" },
  { allow = ["MPL-2.0"], crate = "dtoa-short" },
  # Permissive (Zlib); through `tauri-utils`' HTML handling at build time.
  { allow = ["Zlib"], crate = "foldhash" },
  # Permissive (ISC); the tray icon's library loader on Linux only.
  { allow = ["ISC"], crate = "libloading" },
]

[licenses.private]
# Our own crates are `publish = false`; their licence is MIT OR Apache-2.0.
ignore = true

[advisories]
# Fail on any RustSec advisory, unmaintained crates included. Add an `ignore`
# entry only with its advisory id, a reason and an issue number.
ignore = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Our own crates depend on each other by path, without a version; they are never published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
