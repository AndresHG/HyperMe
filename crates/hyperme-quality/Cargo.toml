[package]
name = "hyperme-quality"
description = "HyperMe's quality harness: replays saved dictations through the app's pipeline and scores them against the owner's corrected texts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "hyperme-quality"
path = "src/main.rs"

[dependencies]
hyperme-core.workspace = true
hyperme-platform = { path = "../hyperme-platform" }
hyperme-providers = { path = "../hyperme-providers" }
rusqlite.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

[lints]
workspace = true
