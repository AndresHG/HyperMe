[package]
name = "hyperme-platform"
description = "HyperMe's platform code behind hyperme-core's traits: microphone, hotkey, paste, focus, keychain."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
hyperme-core.workspace = true
cpal.workspace = true
rusqlite.workspace = true
# The trace store's span fields and events, as small JSON objects (trace_store.rs). Already in
# the workspace.
serde_json.workspace = true
# The microphone's errors as warning events (spec 182, R-14). Already in the tree.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The task store's local dates (task_store.rs), as in hyperme-core.
time.workspace = true
# time: the macOS clock's timer (presence.rs).
tokio = { workspace = true, features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
objc2 = "0.6.5"
security-framework = "3.7.0"
# Notification blocks for presence.rs; already in the tree through Tauri, MIT.
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSDate", "NSDistributedNotificationCenter", "NSEnumerator", "NSGeometry", "NSNotification", "NSOperation", "NSProcessInfo", "NSString", "NSTimeZone"] }
# Core Audio's mute switch on the default output (output_mute.rs, #221). Already in the tree
# through cpal, with the same features, MIT.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSApplication", "NSEvent", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSRunningApplication", "NSSound", "NSWorkspace"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
