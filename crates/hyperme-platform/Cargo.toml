[package]
name = "hyperme-platform"
description = "HyperMe's platform code behind hyperme-core's traits: microphone, hotkey, paste, focus, keychain."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
hyperme-core.workspace = true
cpal.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
objc2 = "0.6.5"
security-framework = "3.7.0"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSSound", "NSWorkspace"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints]
workspace = true
