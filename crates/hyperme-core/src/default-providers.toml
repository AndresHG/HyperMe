# The providers HyperMe offers (specs/96-provider-settings, R-1). Built into the app, so each
# release brings its current prices and providers to every user.
#
# To add a provider of your own, or point a built-in one at another host, copy an entry into
# config.toml. An entry there with the same name replaces the built-in one. Keys never go here.
#
# protocol   how HyperMe talks to it: "speechmatics-rt" (streaming speech) or "openai-chat"
#            (an OpenAI-compatible chat completions API, for cleanup)
# roles      the jobs it can do: "speech", "cleanup"
# key_url    where "Get a key" goes
# key_required = false for a server that needs no key, such as one on this Mac
# list_models  true when the key can list the models it offers
#
# Each model: its prices with the date they were checked against the provider's page, and the
# latency this project measured, with the result it comes from. Check prices before each release.

[providers.speechmatics]
name = "Speechmatics"
protocol = "speechmatics-rt"
# The EU region. wss://global.rt.speechmatics.com/v2 is the global one.
endpoint = "wss://eu.rt.speechmatics.com/v2"
key_url = "https://portal.speechmatics.com/signup"
roles = ["speech"]
# USD 100 of credit for new accounts; it lasts 12 months.
free_credit_usd = 100

# From speechmatics.com/pricing: real-time Melia 1 at USD 0.40 an hour.
[[providers.speechmatics.models]]
id = "melia-1"
price_per_hour_usd = 0.40
prices_checked = "2026-11-26"
measured = { release_to_text_ms = 426, p90_ms = 587, source = "docs/results/2026-11-25-eu-speech.md" }

[providers.groq]
name = "Groq"
order = 10
protocol = "openai-chat"
endpoint = "https://api.groq.com/openai/v1"
key_url = "https://console.groq.com/keys"
roles = ["cleanup"]
list_models = true

# From Groq's openai/gpt-oss-20b page: USD 0.075 per million input tokens and USD 0.30 per
# million output tokens. The measurement is key release to cleaned text with Speechmatics.
[[providers.groq.models]]
id = "openai/gpt-oss-20b"
price_input_per_million_usd = 0.075
price_output_per_million_usd = 0.30
prices_checked = "2026-11-26"
reasoning_effort = ["low", "medium", "high"]
measured = { release_to_text_ms = 426, p90_ms = 587, source = "docs/results/2026-11-25-eu-speech.md" }

# The providers below were checked against each provider's own docs and pricing pages on
# 26 November 2026 (specs/96-provider-settings, slice 3). reasoning_effort lists only values the
# model's page names, fastest first; a model with none listed never gets the field. None of them
# is measured yet, so Settings shows "Speed not measured".

# OpenAI: the PRD's first extra provider (D-4).
# developers.openai.com/api/reference: base URL, Bearer auth, GET /models, streaming.
[providers.openai]
name = "OpenAI"
order = 20
protocol = "openai-chat"
endpoint = "https://api.openai.com/v1"
key_url = "https://platform.openai.com/settings/organization/api-keys"
roles = ["cleanup"]
list_models = true

# developers.openai.com/api/docs/models/gpt-6-luna: standard tier.
[[providers.openai.models]]
id = "gpt-6-luna"
price_input_per_million_usd = 0.10
price_output_per_million_usd = 0.50
prices_checked = "2026-11-26"
reasoning_effort = ["none", "low", "medium", "high"]

# developers.openai.com/api/docs/models/gpt-6.1-terra: standard tier.
[[providers.openai.models]]
id = "gpt-6.1-terra"
price_input_per_million_usd = 1.00
price_output_per_million_usd = 5.00
prices_checked = "2026-11-26"
reasoning_effort = ["none", "low", "medium", "high"]

# OpenRouter: one key, many models. openrouter.ai/docs/quickstart and api-reference/parameters;
# a parameter a model does not take is ignored, not refused.
[providers.openrouter]
name = "OpenRouter"
order = 30
protocol = "openai-chat"
endpoint = "https://openrouter.ai/api/v1"
key_url = "https://openrouter.ai/keys"
roles = ["cleanup"]
list_models = true

# openrouter.ai/openai/gpt-6-luna
[[providers.openrouter.models]]
id = "openai/gpt-6-luna"
price_input_per_million_usd = 0.10
price_output_per_million_usd = 0.50
prices_checked = "2026-11-26"
reasoning_effort = ["none", "low", "medium", "high"]

# openrouter.ai/google/gemini-3.5-flash-lite
[[providers.openrouter.models]]
id = "google/gemini-3.5-flash-lite"
price_input_per_million_usd = 0.30
price_output_per_million_usd = 2.50
prices_checked = "2026-11-26"

# Google Gemini through Google's OpenAI compatibility endpoint (beta):
# ai.google.dev/gemini-api/docs/openai. Prices from aistudio.google.com/docs/pricing.
# Flash-Lite already thinks at "minimal" by default, so no effort is sent.
[providers.gemini]
name = "Google Gemini"
order = 40
protocol = "openai-chat"
endpoint = "https://generativelanguage.googleapis.com/v1beta/openai"
key_url = "https://aistudio.google.com/apikey"
roles = ["cleanup"]
list_models = true

[[providers.gemini.models]]
id = "gemini-3.5-flash-lite"
price_input_per_million_usd = 0.30
price_output_per_million_usd = 2.50
prices_checked = "2026-11-26"

[[providers.gemini.models]]
id = "gemini-3.1-flash-lite"
price_input_per_million_usd = 0.25
price_output_per_million_usd = 1.50
prices_checked = "2026-11-26"

# Anthropic through its OpenAI SDK compatibility layer:
# platform.claude.com/docs/en/cli-sdks-libraries/libraries/openai-sdk. It ignores
# reasoning_effort, and its model list is not OpenAI-shaped, so the menu uses these models.
[providers.anthropic]
name = "Anthropic"
order = 50
protocol = "openai-chat"
endpoint = "https://api.anthropic.com/v1"
key_url = "https://platform.claude.com/settings/keys"
roles = ["cleanup"]

# platform.claude.com/docs/en/about-claude/pricing
[[providers.anthropic.models]]
id = "claude-haiku-5-5"
price_input_per_million_usd = 0.10
price_output_per_million_usd = 0.50
prices_checked = "2026-11-26"

[[providers.anthropic.models]]
id = "claude-sonnet-5-5"
price_input_per_million_usd = 2.00
price_output_per_million_usd = 10.00
prices_checked = "2026-11-26"
