# HyperMe settings. HyperMe writes this file on first launch when there is none.
#
# Keys never go here: they live in the macOS keychain, one per provider, set in Settings.
# An unknown key, a missing key or a value out of range stops HyperMe with a message that
# names it. Delete this file to get the defaults back.

[dictation]
# Hold this key to dictate: "fn" (the Globe key), "right_option", or a chord such as
# "ctrl+option+space" (modifiers: cmd, ctrl, option, shift, fn; then one key).
hotkey = "fn"
# A shorter hold is a tap: nothing is pasted. 50 to 2000.
min_hold_ms = 250
# Hands-free: tap, then press again within this many ms to keep recording without holding the
# key; press once more to stop. 100 to 1000.
double_tap_ms = 400
# Recording stops and is processed at this length. 5 to 600.
max_length_s = 120
# Dictations with fewer words skip the cleanup model. 0 to 50; 0 always cleans.
short_dictation_words = 4
# A soft sound when recording starts and stops.
sounds = true
# A small still bead at the bottom centre while idle; it grows into the pill when you dictate.
show_while_idle = true
# Minutes of talking a day, for the cost estimates in onboarding and Settings. 1 to 600.
talking_minutes_per_day = 30
# Optional: a text file with your own terms, one per line.
# dictionary = "/Users/you/hyperme-dictionary.txt"
# Up to this many dictionary words, the cleanup prompt carries them all; above it, only the ones
# that look relevant to each dictation. 10 to 1000.
dictionary_prompt_cap = 150

[speech]
# Streaming speech-to-text: a provider from the catalogue and one of its models. The catalogue
# (endpoints, key pages, prices) is built into HyperMe; add or replace an entry by writing a
# [providers.<name>] section here (see the comments in default-providers.toml).
provider = "speechmatics"
model = "melia-1"
# Optional: another endpoint for this provider, such as Speechmatics' global region.
# endpoint = "wss://global.rt.speechmatics.com/v2"

[cleanup]
# Fixes the transcript: a provider from the catalogue that can clean, and one of its models.
provider = "groq"
model = "openai/gpt-oss-20b"
# Optional: another endpoint for this provider, such as a proxy.
# endpoint = "https://api.groq.com/openai/v1"
# Sent as reasoning_effort; "off" leaves the field out of the request.
reasoning_effort = "low"
# How much the model changes the transcript: "none" (no model call: the transcript after
# dictionary substitution, with a capital and a full stop), "light" (fillers, punctuation and
# clear mishearings only) or "medium" (also words said twice, false starts, commas, small
# grammar slips and formatting the speaker dictates, such as lists and "new line"). It never
# rephrases or translates.
level = "light"
# Optional: a named prompt version instead of the level's, for experiments.
# prompt = "v4"
# After this many ms without cleaned text, the raw transcript is pasted. 100 to 10000.
deadline_ms = 1500
# What one hour of talking sends to cleanup, for the cost estimate, from the research of
# 24 November 2026 (section 3): about 120 dictations, each about 600 prompt tokens and 100
# output tokens.
estimate_dictations_per_hour = 120
estimate_input_tokens = 600
estimate_output_tokens = 100

[history]
# Keep each dictation's audio and text on this Mac.
enabled = true
# Days to keep, or "unlimited". 1 to 3650.
retention_days = 30
# The oldest items are deleted when history passes this size. 10 to 1000000.
size_limit_mb = 1024
# Keep each dictation's timing trace (stage times and provider names, never text), even with
# history off: 30 days then, or as long as its history item otherwise.
keep_traces = true

[timing]
# Write one line of stage timings per dictation, numbers only, never text.
log = false

[tasks]
# The hour the day turns over, as "HH:MM". A task done before it counts for the day before.
day_start = "04:00"
# The days you work: mon, tue, wed, thu, fri, sat, sun. Morning cards come on these days.
workdays = ["mon", "tue", "wed", "thu", "fri"]
# Roll-overs after which Today asks whether to keep a task, give it a day or drop it. 1 to 30.
stale_after = 3
# The morning card shows the first time you are at the Mac after this time on a workday,
morning_from = "06:00"
# or at this time if you are already there. Later than morning_from.
morning_latest = "09:30"

# Your own MCP servers, by URL or by command (Settings → Connectors adds them for you). A bearer
# token or OAuth client secret is entered in Settings and kept in the keychain, never here.
# Tools ask before running unless you list them under read; list destructive ones under off.
#
# [[connectors.custom]]
# id = "wiki"
# name = "Team wiki"
# url = "https://wiki.example.com/mcp"
# auth = "bearer"            # or "oauth" (with auth_url, token_url, scopes) or "none"
# tools = { read = ["search_*", "get_*"], off = ["delete_*"] }
