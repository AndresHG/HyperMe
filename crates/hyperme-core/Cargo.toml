[package]
name = "hyperme-core"
description = "HyperMe's core: config, the dictation state machine and the traits. No platform calls, no network."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
# The task list's days, due dates and workdays (specs/92-daily-tasks, design.md).
# parsing and formatting: event times from connectors are RFC 3339 (sync.rs).
time = { workspace = true, features = ["parsing", "formatting"] }
# The connectors' tool answers are JSON (sync.rs). Already in the workspace.
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
# The state machine is one async task: channels, timers and select! only, no runtime.
tokio = { workspace = true, features = ["macros", "sync", "time"] }
# Spans for local traces (specs/182-trace-store). Already in the tree through Tokio and Tauri.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The Layer and Registry that collect a dictation's spans into one trace (spec 182, design 5).
# Registry only: no fmt, no env-filter, no regex.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
# TypeScript types for the views the app sends to its pages (spec 257, R-9), only when the app
# asks for them. Pinned exactly like the app's while it is a release candidate.
specta = { version = "=2.0.0-rc.28", features = ["derive"], optional = true }

[features]
specta = ["dep:specta"]

[dev-dependencies]
# Tests run the state machine on a runtime with a paused, manually advanced clock.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
