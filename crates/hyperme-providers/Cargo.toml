[package]
name = "hyperme-providers"
description = "HyperMe's network providers: Speechmatics streaming speech, OpenAI-compatible cleanup and OAuth 2.0 sign-in for connectors."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
hyperme-core.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde_json.workspace = true
# io-util: the OAuth loopback listener reads the browser's redirect (oauth.rs).
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
# OAuth PKCE (RFC 7636, oauth.rs): the S256 challenge, its base64url form, and the random
# verifier and state. All three are already in the tree; MIT OR Apache-2.0.
base64 = "0.22.1"
getrandom = "0.3.4"
sha2 = "0.10.9"
# The one MCP client (CLAUDE.md, design.md): streamable HTTP over the reqwest already here, on
# native TLS like the rest of the app. No default features: they pull in chrono (unmaintained,
# refused by deny.toml) and the server side. Apache-2.0.
rmcp = { version = "3.12.0", default-features = false, features = ["client", "reqwest-native-tls", "transport-streamable-http-client-reqwest"] }
# The request counter's day (connectors::RequestLog).
time.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
# The fake MCP server in tests/fake_mcp: rmcp's own streamable HTTP server behind a small hyper
# server that checks the bearer token. hyper, hyper-util and http-body-util are already in the
# tree through reqwest; all MIT.
rmcp = { version = "3.12.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
hyper = { version = "1.13.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"

[lints]
workspace = true
